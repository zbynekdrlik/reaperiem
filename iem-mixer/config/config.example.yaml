# IEM Mixer Configuration

# REAPER HTTP API endpoint
reaper_url: "http://iem.lan:8080"

# Server port (default 80 for clean URLs)
port: 80

# JWT secret - set via environment variable IEM_JWT_SECRET
# jwt_secret: ""

# Dante output channel mappings, keyed by REAPER track name prefix.
# REAPER is the source of truth for member names - this config only provides Dante routing.
# Example: REAPER track "MAREK inear" maps to Dante outputs 25 (L) and 26 (R).
dante_outputs:
  MAREK: [25, 26]
  PETKA: [27, 28]

# Input tracks from FOH
inputs:
  - name: DRUMS
    dante_input: 1
    default_level_db: -6

  - name: BASS
    dante_input: 3
    default_level_db: -6

# PIN codes - set via environment or separate pins.yaml
pins: {}

# Engineer PIN - set via environment variable IEM_ENGINEER_PIN
# engineer_pin: ""
