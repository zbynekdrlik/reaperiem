[package]
name = "iem-ui"
version = "0.1.0"
edition = "2024"
authors = ["REAPER IEM Team"]
description = "Leptos WASM frontend for IEM mixer"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Leptos with CSR (client-side rendering)
leptos = { version = "0.7", features = ["csr"] }
leptos_router = "0.7"

# WASM support
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"

# Web APIs
web-sys = { version = "0.3", features = [
    "Window",
    "Storage",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "Location",
    "console",
] }
js-sys = "0.3"

# HTTP requests from WASM
gloo-net = "0.6"
gloo-timers = "0.3"
gloo-storage = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
