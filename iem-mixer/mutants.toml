# cargo-mutants configuration for the iem-mixer workspace.
#
# Rationale for exclusions: axum route handlers and WebSocket handlers
# require full AppState plus WebSocket plumbing to unit-test meaningfully.
# Those functions are covered end-to-end by the live post-deploy Playwright
# tests in iem-mixer/e2e/tests/live/ — in particular
# talkback-quality.spec.ts for #154 exercises the entire browser →
# WebSocket → server → UDP → REAPER VST flow, with real auth and real
# binary frames. Mutation testing at the unit-test layer for these
# handlers produces MISSED mutants that can only be caught by spinning
# up an axum test harness, which duplicates the live E2E coverage at
# higher maintenance cost.
#
# Pure-logic modules (talkback_buffer, etc.) remain fully mutation-tested.

exclude_re = [
    # Talkback WS handler — covered by live talkback-quality.spec.ts
    "handle_talkback_ws",
    # Talkback diagnostics handler (auth + metrics read) — covered by
    # live talkback-quality.spec.ts A4 assertions.
    "talkback_diagnostics_handler",
]
