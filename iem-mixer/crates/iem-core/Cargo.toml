[package]
name = "iem-core"
version = "1.71.0"
edition = "2024"
authors = ["REAPER IEM Team"]
description = "Core types and configuration for IEM mixer"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = { version = "0.9", optional = true }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Constant-time comparison for PIN verification (prevents timing attacks)
subtle = "2"

[features]
default = ["config"]
config = ["dep:serde_yaml"]
