[package]
name = "iem-server"
version = "1.93.0"
edition = "2024"
authors = ["REAPER IEM Team"]
description = "Axum API server for IEM mixer"
license = "MIT"

[dependencies]
# Core library
iem-core = { path = "../iem-core" }

# Web framework
axum = { version = "0.8", features = ["macros", "json", "ws"] }

# Tower middleware
tower-http = { version = "0.6", features = ["fs", "cors", "set-header"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }

# HTTP client for REAPER proxy
reqwest = { version = "0.12", features = ["json"] }

# Async combinators (parallel futures)
futures = "0.3"

# JWT authentication
jsonwebtoken = "9"


# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Embed WASM assets
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"

# Date/time for daily snapshots
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# System info
local-ip-address = "0.6"

# For standalone server binary
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# TLS support for HTTPS (PWA installability on phones)
axum-server = { version = "0.8", features = ["tls-rustls"], optional = true }
rustls = { version = "0.23", features = ["ring"], optional = true }
dirs = { version = "6.0", optional = true }

# Audio streaming (VBAN -> Opus -> WebSocket)
opus = { version = "0.3", optional = true }
rubato = { version = "0.14", optional = true }
bytes = { version = "1", optional = true }

[[bin]]
name = "iem-server"
path = "src/bin/server.rs"
required-features = ["standalone"]

[features]
default = []
standalone = ["tracing-subscriber"]
tls = ["axum-server", "rustls", "dirs"]
audio = ["dep:opus", "dep:rubato", "dep:bytes"]
integration = []  # gates live REAPER integration tests in tests/reaper_live.rs
