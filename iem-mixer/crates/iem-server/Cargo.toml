[package]
name = "iem-server"
version = "0.1.0"
edition = "2024"
authors = ["REAPER IEM Team"]
description = "Axum API server for IEM mixer"
license = "MIT"

[dependencies]
# Core library
iem-core = { path = "../iem-core" }

# Web framework
axum = { version = "0.8", features = ["macros", "json"] }

# Tower middleware
tower-http = { version = "0.6", features = ["fs", "cors", "set-header"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }

# HTTP client for REAPER proxy
reqwest = { version = "0.12", features = ["json"] }

# JWT authentication
jsonwebtoken = "9"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Embed WASM assets
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"

# System info
local-ip-address = "0.6"
