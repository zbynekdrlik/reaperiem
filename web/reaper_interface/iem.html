<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>IEM Mixer - Select Member</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 {
            color: #4ecdc4;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 40px;
        }
        .members {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }
        .member-btn {
            display: block;
            padding: 25px 30px;
            background: linear-gradient(145deg, #0f3460, #0a2540);
            color: #fff;
            text-decoration: none;
            border-radius: 15px;
            font-size: 1.3em;
            font-weight: 600;
            text-align: center;
            border: 2px solid rgba(78, 205, 196, 0.3);
            transition: all 0.2s ease;
        }
        .member-btn:active {
            background: linear-gradient(145deg, #4ecdc4, #45b7aa);
            color: #1a1a2e;
            transform: scale(0.98);
        }
        .footer {
            margin-top: 40px;
            font-size: 0.8em;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>IEM Mixer</h1>
    <div class="members">
        <a href="/iem_mixer.html?member=1" class="member-btn">Marek</a>
        <!-- Add more members as they join -->
        <!-- <a href="/iem_mixer.html?member=2" class="member-btn">Member 2</a> -->
    </div>
    <div class="footer">
        Select your name to control your mix
    </div>
</body>
</html>
