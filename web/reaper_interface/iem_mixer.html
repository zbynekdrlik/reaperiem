<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>IEM Mixer</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            user-select: none;
        }

        .header {
            text-align: center;
            padding: 15px;
            border-bottom: 2px solid #4ecdc4;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.8em;
            color: #4ecdc4;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .member-name {
            font-size: 1.2em;
            color: #fff;
            margin-top: 5px;
            font-weight: 300;
        }

        .channels {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 80px;
        }

        .channel {
            background: rgba(22, 33, 62, 0.8);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(78, 205, 196, 0.2);
        }

        .channel.muted {
            opacity: 0.5;
        }

        .channel-name {
            min-width: 90px;
            font-weight: 600;
            font-size: 0.85em;
            color: #4ecdc4;
            text-transform: uppercase;
        }

        .slider-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 44px;
            background: linear-gradient(90deg, #0f3460 0%, #1a1a2e 100%);
            border-radius: 22px;
            outline: none;
            border: 2px solid rgba(78, 205, 196, 0.3);
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 54px;
            height: 54px;
            background: linear-gradient(145deg, #4ecdc4, #45b7aa);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(78, 205, 196, 0.4);
        }

        .slider::-moz-range-thumb {
            width: 54px;
            height: 54px;
            background: linear-gradient(145deg, #4ecdc4, #45b7aa);
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 15px rgba(78, 205, 196, 0.4);
        }

        .level-display {
            min-width: 55px;
            text-align: right;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 0.9em;
            color: #888;
        }

        .mute-btn {
            width: 54px;
            height: 54px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.15s ease;
        }

        .mute-btn.off {
            background: linear-gradient(145deg, #2a2a4a, #1a1a3a);
            color: #666;
            border: 2px solid #333;
        }

        .mute-btn.on {
            background: linear-gradient(145deg, #e63946, #c1121f);
            color: white;
            box-shadow: 0 4px 15px rgba(230, 57, 70, 0.4);
        }

        .presets {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            gap: 8px;
            padding: 12px;
            background: rgba(26, 26, 46, 0.95);
            border-top: 1px solid #333;
            backdrop-filter: blur(10px);
        }

        .preset-btn {
            flex: 1;
            padding: 14px 8px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(145deg, #0f3460, #0a2540);
            color: #eee;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid rgba(78, 205, 196, 0.2);
        }

        .preset-btn:active {
            background: linear-gradient(145deg, #4ecdc4, #45b7aa);
            color: #1a1a2e;
        }

        .status {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #666;
        }

        .status.connected {
            background: #4ecdc4;
            box-shadow: 0 0 10px #4ecdc4;
        }

        .status.error {
            background: #e63946;
            box-shadow: 0 0 10px #e63946;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        /* More Me slider - personal channel */
        .channel.more-me {
            background: rgba(78, 205, 196, 0.1);
            border: 2px solid rgba(78, 205, 196, 0.5);
        }

        .channel.more-me .channel-name {
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="status" id="status"></div>

    <div class="header">
        <h1>IEM Mix</h1>
        <div class="member-name" id="memberName">Loading...</div>
    </div>

    <div class="channels" id="channels">
        <div class="loading">Connecting to REAPER...</div>
    </div>

    <div class="presets">
        <button class="preset-btn" onclick="loadPreset('default')">Reset</button>
        <button class="preset-btn" onclick="adjustAll(3)">+3dB All</button>
        <button class="preset-btn" onclick="adjustAll(-3)">-3dB All</button>
        <button class="preset-btn" onclick="moreMe()">More Me</button>
    </div>

    <script src="/main.js"></script>
    <script>
        // Band member configuration - loaded from URL or config
        const BAND_MEMBERS = {
            1: { name: "Marek", outputTrack: 2, myInput: "MAREK mic" }
            // Add more members as needed
        };

        // Get member ID from URL: /iem_mixer.html?member=1 or /member/1
        const urlParams = new URLSearchParams(window.location.search);
        let memberId = parseInt(urlParams.get('member')) || 1;

        // Also support /member/X path format
        const pathMatch = window.location.pathname.match(/\/member\/(\d+)/);
        if (pathMatch) {
            memberId = parseInt(pathMatch[1]);
        }

        const memberConfig = BAND_MEMBERS[memberId] || { name: `Member ${memberId}`, outputTrack: memberId + 1 };

        let tracks = [];
        let sendLevels = {}; // trackIndex -> send level to our output
        let sendMutes = {};  // trackIndex -> send mute state

        // Set member name
        document.getElementById('memberName').textContent = memberConfig.name;

        // Initialize REAPER web interface
        wwr_start();

        // Request track and send data
        function requestData() {
            // Request all tracks with extended info
            wwr_req_recur("NTRACK;TRACK", 500);
        }

        // Handle responses from REAPER
        wwr_onreply = function(response) {
            const lines = response.split('\n');
            const newTracks = [];

            for (const line of lines) {
                const parts = line.split('\t');
                if (parts[0] === 'TRACK' && parts.length > 2) {
                    const track = {
                        index: parseInt(parts[1]),
                        name: parts[2],
                        volume: parseFloat(parts[4]) || 1.0,
                        pan: parseFloat(parts[5]) || 0,
                        muted: (parseInt(parts[6]) & 8) !== 0,
                        flags: parseInt(parts[6]) || 0,
                        sendCount: parseInt(parts[10]) || 0,
                        recvCount: parseInt(parts[11]) || 0
                    };
                    newTracks.push(track);
                }
            }

            if (newTracks.length > 0) {
                tracks = newTracks;
                // After getting tracks, request send info for input tracks
                requestSendInfo();
                renderChannels();
                updateStatus('connected');
            }
        };

        function requestSendInfo() {
            // For each input track, request its sends
            const inputTracks = tracks.filter(t => t.sendCount > 0 && !t.name.toLowerCase().includes('inear'));
            for (const track of inputTracks) {
                for (let s = 0; s < track.sendCount; s++) {
                    wwr_req(`GET/TRACK/${track.index}/SEND/${s}/VOL`);
                    wwr_req(`GET/TRACK/${track.index}/SEND/${s}/MUTE`);
                }
            }
        }

        function renderChannels() {
            const container = document.getElementById('channels');

            // Filter to show only input tracks (those with sends, not output buses)
            const inputTracks = tracks.filter(t =>
                !t.name.toLowerCase().includes('inear') &&
                !t.name.toLowerCase().includes('output') &&
                t.index > 0
            );

            if (inputTracks.length === 0) {
                container.innerHTML = '<div class="loading">No input tracks found</div>';
                return;
            }

            container.innerHTML = '';

            for (const track of inputTracks) {
                const isMyInput = track.name.toLowerCase().includes(memberConfig.myInput?.toLowerCase() || '___none___');
                const level = sendLevels[track.index] || 1.0;
                const muted = sendMutes[track.index] || false;

                const div = document.createElement('div');
                div.className = 'channel' + (isMyInput ? ' more-me' : '') + (muted ? ' muted' : '');
                div.dataset.track = track.index;

                div.innerHTML = `
                    <div class="channel-name">${formatTrackName(track.name)}</div>
                    <div class="slider-container">
                        <input type="range" class="slider"
                               min="0" max="100" value="${volumeToSlider(level)}"
                               data-track="${track.index}"
                               onchange="setSendLevel(${track.index}, this.value)"
                               oninput="updateDisplay(${track.index}, this.value)">
                        <div class="level-display" id="level-${track.index}">
                            ${volumeToDb(level)}
                        </div>
                    </div>
                    <button class="mute-btn ${muted ? 'on' : 'off'}"
                            id="mute-${track.index}"
                            onclick="toggleMute(${track.index})">
                        M
                    </button>
                `;
                container.appendChild(div);
            }
        }

        function formatTrackName(name) {
            // Remove common suffixes for cleaner display
            return name.replace(/\s*(mic|guitar|keys|drums|bass|vocal)$/i, (m) => `<br><small>${m.trim()}</small>`);
        }

        function volumeToSlider(vol) {
            if (vol <= 0) return 0;
            const db = 20 * Math.log10(vol);
            // Map -60dB to +6dB -> 0 to 100
            return Math.max(0, Math.min(100, (db + 60) * 100 / 66));
        }

        function sliderToVolume(slider) {
            const db = (slider * 66 / 100) - 60;
            return Math.pow(10, db / 20);
        }

        function volumeToDb(vol) {
            if (vol <= 0.001) return '-∞';
            const db = 20 * Math.log10(vol);
            if (db < -59) return '-∞';
            return (db >= 0 ? '+' : '') + db.toFixed(1);
        }

        function setSendLevel(trackIndex, sliderValue) {
            const vol = sliderToVolume(sliderValue);
            sendLevels[trackIndex] = vol;
            // Find send index to our output track (usually send 0)
            wwr_req(`SET/TRACK/${trackIndex}/SEND/0/VOL/${vol.toFixed(6)}`);
        }

        function updateDisplay(trackIndex, sliderValue) {
            const vol = sliderToVolume(sliderValue);
            const display = document.getElementById(`level-${trackIndex}`);
            if (display) {
                display.textContent = volumeToDb(vol);
            }
        }

        function toggleMute(trackIndex) {
            const currentMute = sendMutes[trackIndex] || false;
            sendMutes[trackIndex] = !currentMute;
            wwr_req(`SET/TRACK/${trackIndex}/SEND/0/MUTE/${currentMute ? 0 : 1}`);

            // Update UI immediately
            const btn = document.getElementById(`mute-${trackIndex}`);
            const channel = document.querySelector(`.channel[data-track="${trackIndex}"]`);
            if (btn) {
                btn.className = `mute-btn ${!currentMute ? 'on' : 'off'}`;
            }
            if (channel) {
                channel.classList.toggle('muted', !currentMute);
            }
        }

        function loadPreset(name) {
            if (name === 'default') {
                // Reset all sends to 0dB
                const sliders = document.querySelectorAll('.slider');
                sliders.forEach(slider => {
                    slider.value = volumeToSlider(1.0);
                    setSendLevel(parseInt(slider.dataset.track), slider.value);
                    updateDisplay(parseInt(slider.dataset.track), slider.value);
                });
            }
        }

        function adjustAll(dbChange) {
            const sliders = document.querySelectorAll('.slider');
            sliders.forEach(slider => {
                const currentVol = sliderToVolume(slider.value);
                const currentDb = 20 * Math.log10(currentVol || 0.001);
                const newDb = Math.max(-60, Math.min(6, currentDb + dbChange));
                const newVol = Math.pow(10, newDb / 20);
                slider.value = volumeToSlider(newVol);
                setSendLevel(parseInt(slider.dataset.track), slider.value);
                updateDisplay(parseInt(slider.dataset.track), slider.value);
            });
        }

        function moreMe() {
            // Boost my input by 6dB, reduce others by 3dB
            const sliders = document.querySelectorAll('.slider');
            sliders.forEach(slider => {
                const trackIndex = parseInt(slider.dataset.track);
                const track = tracks.find(t => t.index === trackIndex);
                const isMyInput = track && track.name.toLowerCase().includes(memberConfig.myInput?.toLowerCase() || '___none___');

                const currentVol = sliderToVolume(slider.value);
                const currentDb = 20 * Math.log10(currentVol || 0.001);
                const dbChange = isMyInput ? 6 : -3;
                const newDb = Math.max(-60, Math.min(6, currentDb + dbChange));
                const newVol = Math.pow(10, newDb / 20);

                slider.value = volumeToSlider(newVol);
                setSendLevel(trackIndex, slider.value);
                updateDisplay(trackIndex, slider.value);
            });
        }

        function updateStatus(type) {
            const status = document.getElementById('status');
            status.className = 'status ' + type;
        }

        // Start requesting data
        requestData();
    </script>
</body>
</html>
