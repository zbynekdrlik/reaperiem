<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>IEM Mixer</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            padding: 10px;
            border-bottom: 1px solid #333;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5em;
            color: #4ecdc4;
        }

        .member-name {
            font-size: 0.9em;
            color: #888;
        }

        .channels {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .channel {
            background: #16213e;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .channel-name {
            min-width: 100px;
            font-weight: bold;
            font-size: 0.9em;
        }

        .slider-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slider {
            flex: 1;
            -webkit-appearance: none;
            height: 40px;
            background: #0f3460;
            border-radius: 20px;
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 50px;
            height: 50px;
            background: #4ecdc4;
            border-radius: 50%;
            cursor: pointer;
        }

        .slider::-moz-range-thumb {
            width: 50px;
            height: 50px;
            background: #4ecdc4;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .level-display {
            min-width: 60px;
            text-align: right;
            font-family: monospace;
            font-size: 1.1em;
        }

        .mute-btn {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8em;
        }

        .mute-btn.off {
            background: #333;
            color: #888;
        }

        .mute-btn.on {
            background: #e63946;
            color: white;
        }

        .presets {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .preset-btn {
            flex: 1;
            min-width: 80px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #0f3460;
            color: #eee;
            font-size: 1em;
            cursor: pointer;
        }

        .preset-btn:active {
            background: #4ecdc4;
            color: #1a1a2e;
        }

        .status {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            padding: 10px;
            background: #333;
            border-radius: 5px;
            text-align: center;
            font-size: 0.8em;
        }

        .status.connected {
            background: #1d3557;
        }

        .status.error {
            background: #e63946;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>IEM Mixer</h1>
        <div class="member-name" id="memberName">Loading...</div>
    </div>

    <div class="channels" id="channels">
        <!-- Channels populated by JavaScript -->
    </div>

    <div class="presets">
        <button class="preset-btn" onclick="loadPreset('default')">Default</button>
        <button class="preset-btn" onclick="loadPreset('more_me')">More Me</button>
        <button class="preset-btn" onclick="loadPreset('less_me')">Less Me</button>
        <button class="preset-btn" onclick="savePreset()">Save</button>
    </div>

    <div class="status" id="status">Connecting...</div>

    <script src="/main.js"></script>
    <script>
        // Get member ID from URL: /member/1, /member/2, etc.
        const pathParts = window.location.pathname.split('/');
        const memberId = parseInt(pathParts[pathParts.length - 1]) || 1;

        let tracks = [];
        let memberSendIndex = memberId; // Assumes send index matches member ID

        // Initialize REAPER web interface
        wwr_start();

        // Request track data periodically
        function updateTracks() {
            wwr_req_recur("NTRACK;TRACK", 500);
        }

        // Handle responses from REAPER
        wwr_onreply = function(response) {
            const lines = response.split('\n');
            let trackCount = 0;
            const newTracks = [];

            for (const line of lines) {
                const parts = line.split('\t');
                if (parts[0] === 'NTRACK') {
                    trackCount = parseInt(parts[1]);
                } else if (parts[0] === 'TRACK' && parts.length > 2) {
                    newTracks.push({
                        index: parseInt(parts[1]),
                        name: parts[2],
                        volume: parseFloat(parts[3]) || 1.0,
                        pan: parseFloat(parts[4]) || 0,
                        mute: parseInt(parts[5]) || 0,
                    });
                }
            }

            if (newTracks.length > 0) {
                tracks = newTracks;
                renderChannels();
                updateStatus('connected', 'Connected');
            }
        };

        function renderChannels() {
            const container = document.getElementById('channels');
            container.innerHTML = '';

            // Filter to show only input tracks (not output buses)
            const inputTracks = tracks.filter(t => !t.name.includes('inear'));

            for (const track of inputTracks) {
                const div = document.createElement('div');
                div.className = 'channel';
                div.innerHTML = `
                    <div class="channel-name">${track.name}</div>
                    <div class="slider-container">
                        <input type="range" class="slider"
                               min="0" max="100" value="${volumeToSlider(track.volume)}"
                               data-track="${track.index}"
                               onchange="setVolume(${track.index}, this.value)"
                               oninput="updateDisplay(${track.index}, this.value)">
                        <div class="level-display" id="level-${track.index}">
                            ${volumeToDb(track.volume)}
                        </div>
                    </div>
                    <button class="mute-btn ${track.mute ? 'on' : 'off'}"
                            onclick="toggleMute(${track.index})">
                        M
                    </button>
                `;
                container.appendChild(div);
            }
        }

        function volumeToSlider(vol) {
            // Convert linear 0-2 to slider 0-100 (log scale)
            if (vol <= 0) return 0;
            const db = 20 * Math.log10(vol);
            // Map -60dB to +6dB -> 0 to 100
            return Math.max(0, Math.min(100, (db + 60) * 100 / 66));
        }

        function sliderToVolume(slider) {
            // Convert slider 0-100 to linear volume
            const db = (slider * 66 / 100) - 60;
            return Math.pow(10, db / 20);
        }

        function volumeToDb(vol) {
            if (vol <= 0) return '-inf dB';
            const db = 20 * Math.log10(vol);
            return db.toFixed(1) + ' dB';
        }

        function setVolume(trackIndex, sliderValue) {
            const vol = sliderToVolume(sliderValue);
            // Set send level from this track to member's output
            wwr_req(`SET/TRACK/${trackIndex}/SEND/${memberSendIndex}/VOL/${vol}`);
        }

        function updateDisplay(trackIndex, sliderValue) {
            const vol = sliderToVolume(sliderValue);
            document.getElementById(`level-${trackIndex}`).textContent = volumeToDb(vol);
        }

        function toggleMute(trackIndex) {
            wwr_req(`SET/TRACK/${trackIndex}/SEND/${memberSendIndex}/MUTE/-1`);
        }

        function loadPreset(name) {
            // TODO: Load preset from server
            updateStatus('connected', `Loading ${name}...`);
        }

        function savePreset() {
            // TODO: Save current mix as preset
            updateStatus('connected', 'Saving...');
        }

        function updateStatus(type, message) {
            const status = document.getElementById('status');
            status.className = 'status ' + type;
            status.textContent = message;
        }

        // Set member name
        document.getElementById('memberName').textContent = `Member ${memberId}`;

        // Start updates
        updateTracks();
    </script>
</body>
</html>
