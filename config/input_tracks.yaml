    stereo_pair: "inst"

  - name: "OTHER L"
    dante_input: 27
    category: stems
    default_level_db: 0.0
    stereo_pair: "other"

  - name: "OTHER R"
    dante_input: 28
    category: stems
    default_level_db: 0.0
    stereo_pair: "other"

  - name: "BGVS L"
    dante_input: 29
    category: stems
    default_level_db: 0.0
    stereo_pair: "bgvs"

  - name: "BGVS R"
    dante_input: 30
    category: stems
