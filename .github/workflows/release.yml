name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v0.1.0) - leave empty for dev build"
        required: false
        default: ""
      deploy:
        description: "Deploy to iem.lan after build"
        required: false
        default: "true"
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Only one release at a time
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ============================================================
  # VALIDATE - Ensure code passes all checks first
  # ============================================================
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        working-directory: iem-mixer
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: iem-mixer
        run: cargo clippy --all-targets -- -D warnings

      - name: Create minimal dist folder for rust-embed
        run: |
          mkdir -p iem-mixer/iem-ui/dist
          echo "placeholder" > iem-mixer/iem-ui/dist/index.html

      - name: Run tests
        working-directory: iem-mixer
        run: cargo test -p iem-core -p iem-server

  # ============================================================
  # BUILD WASM
  # ============================================================
  build-wasm:
    name: Build WASM Frontend
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-wasm-release-${{ hashFiles('iem-mixer/iem-ui/Cargo.lock') }}

      - name: Install Trunk
        run: |
          if ! command -v trunk &> /dev/null; then
            cargo install trunk
          fi

      - name: Build WASM (release)
        working-directory: iem-mixer/iem-ui
        run: trunk build --release

      - name: Upload WASM dist
        uses: actions/upload-artifact@v4
        with:
          name: wasm-dist
          path: iem-mixer/iem-ui/dist/
          retention-days: 7

  # ============================================================
  # BUILD TAURI - Windows installers
  # ============================================================
  build-tauri:
    name: Build Tauri (Windows)
    runs-on: windows-latest
    needs: build-wasm
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" == "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="dev-${{ github.sha }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Download WASM dist
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: iem-mixer/iem-ui/dist/

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            iem-mixer/target/
          key: ${{ runner.os }}-cargo-tauri-release-${{ hashFiles('iem-mixer/**/Cargo.lock') }}

      - name: Install Tauri CLI
        shell: bash
        run: |
          if ! command -v cargo-tauri &> /dev/null; then
            cargo install tauri-cli
          fi

      - name: Build Tauri (release)
        working-directory: iem-mixer/src-tauri
        run: cargo tauri build --bundles nsis,msi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: List build outputs
        shell: bash
        run: |
          echo "=== NSIS ==="
          ls -la iem-mixer/target/release/bundle/nsis/ || echo "No NSIS output"
          echo "=== MSI ==="
          ls -la iem-mixer/target/release/bundle/msi/ || echo "No MSI output"

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: iem-mixer/target/release/bundle/nsis/*.exe
          retention-days: 7

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: iem-mixer/target/release/bundle/msi/*.msi
          retention-days: 7

      - name: Upload update artifacts
        uses: actions/upload-artifact@v4
        with:
          name: update-artifacts
          path: |
            iem-mixer/target/release/bundle/nsis/*.nsis.zip
            iem-mixer/target/release/bundle/nsis/*.nsis.zip.sig
          retention-days: 7
          if-no-files-found: ignore

  # ============================================================
  # CREATE RELEASE - GitHub release with all artifacts
  # ============================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-tauri
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/windows-nsis/*.exe release/ || true
          cp artifacts/windows-msi/*.msi release/ || true
          cp artifacts/update-artifacts/*.zip release/ || true
          cp artifacts/update-artifacts/*.sig release/ || true
          ls -la release/

      - name: Generate latest.json for updater
        run: |
          VERSION="${{ needs.build-tauri.outputs.version }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix

          # Find the NSIS zip file
          NSIS_ZIP=$(ls release/*.nsis.zip 2>/dev/null | head -1 || echo "")
          if [ -n "$NSIS_ZIP" ]; then
            SIG_FILE="${NSIS_ZIP}.sig"
            if [ -f "$SIG_FILE" ]; then
              SIGNATURE=$(cat "$SIG_FILE")
            else
              SIGNATURE=""
            fi

            cat > release/latest.json << EOF
          {
            "version": "$VERSION",
            "notes": "See release notes on GitHub",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIGNATURE",
                "url": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$(basename $NSIS_ZIP)"
              }
            }
          }
          EOF
            echo "Generated latest.json:"
            cat release/latest.json
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}

  # ============================================================
  # DEPLOY TO IEM.LAN - Auto-deploy on local runner
  # ============================================================
  deploy:
    name: Deploy to iem.lan
    runs-on: [self-hosted, iem-lan]
    needs: [build-wasm, build-tauri]
    if: github.event.inputs.deploy != 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM dist
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: wasm-dist/

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis
          path: installer/

      - name: Deploy WASM to REAPER www root
        shell: cmd
        run: |
          xcopy /E /Y wasm-dist\* "C:\Program Files\REAPER (x64)\Plugins\reaper_www_root\iem-mixer\"
          echo WASM deployed to REAPER www root

      - name: Stop existing IEM Mixer
        shell: powershell
        run: |
          $proc = Get-Process -Name "iem-mixer-app" -ErrorAction SilentlyContinue
          if ($proc) {
            Write-Host "Stopping existing IEM Mixer..."
            Stop-Process -Name "iem-mixer-app" -Force
            Start-Sleep -Seconds 2
          }

      - name: Install IEM Mixer app
        shell: cmd
        run: |
          for %%f in (installer\*.exe) do (
            echo Installing %%f...
            "%%f" /S
          )
          echo Installation complete!

      - name: Start IEM Mixer app
        shell: powershell
        run: |
          $appPath = "$env:LOCALAPPDATA\IEM Mixer\iem-mixer-app.exe"
          if (Test-Path $appPath) {
            Write-Host "Starting IEM Mixer..."
            Start-Process -FilePath $appPath -WindowStyle Hidden
            Start-Sleep -Seconds 5
          } else {
            Write-Host "ERROR: IEM Mixer not found at $appPath"
            exit 1
          }

      - name: Verify app is running and port 80 listening
        shell: powershell
        run: |
          # Check process is running
          $proc = Get-Process -Name "iem-mixer-app" -ErrorAction SilentlyContinue
          if (-not $proc) {
            Write-Host "ERROR: IEM Mixer process not running"
            exit 1
          }
          Write-Host "IEM Mixer process running (PID: $($proc.Id))"

          # Check port 80 is listening
          $port80 = Get-NetTCPConnection -LocalPort 80 -State Listen -ErrorAction SilentlyContinue
          if (-not $port80) {
            Write-Host "ERROR: Port 80 not listening"
            exit 1
          }
          Write-Host "Port 80 is listening"

          # Test HTTP response
          try {
            $response = Invoke-WebRequest -Uri "http://localhost:80/" -UseBasicParsing -TimeoutSec 10
            if ($response.StatusCode -eq 200) {
              Write-Host "HTTP OK - IEM Mixer responding on port 80"
            }
          } catch {
            Write-Host "ERROR: HTTP request failed: $_"
            exit 1
          }

      - name: Verify WASM deployment
        shell: cmd
        run: |
          if exist "C:\Program Files\REAPER (x64)\Plugins\reaper_www_root\iem-mixer\index.html" (
            echo WASM deployment verified!
          ) else (
            echo ERROR: WASM not found
            exit /b 1
          )

  # ============================================================
  # NOTIFY - Summary of release
  # ============================================================
  notify:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [build-tauri, create-release, deploy]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.build-tauri.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build-tauri.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release | ${{ needs.create-release.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
