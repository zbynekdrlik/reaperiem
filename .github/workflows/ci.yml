      - name: Test audio pipeline (VBAN UDP to WebSocket Opus frames)
        shell: powershell
        run: |
          # This test PROVES the full audio pipeline works end-to-end:
          #   1. Send synthetic VBAN UDP to 127.0.0.1:6980
          #   2. Login as engineer, get JWT
          #   3. Connect WebSocket to ws://localhost:80/ws/audio?token=JWT
          #   4. Send ListenStart command
          #   5. Verify binary Opus frames arrive
          #   FAIL if no binary frames within 15 seconds

          $ErrorActionPreference = "Stop"

          # Verify UDP listener exists on port 6980
          $udpListeners = netstat -an | Select-String "UDP.*:6980"
          if (-not $udpListeners) {
            Write-Host "::error::No UDP listener on port 6980 - app not listening for VBAN"
            exit 1
          }
          Write-Host "UDP 6980 listener found: $udpListeners"

          # Step 1: Start background VBAN UDP sender (keeps sending for 15 seconds)
          $udpJob = Start-Job -ScriptBlock {
            # VBAN packet format: 28-byte header + interleaved INT16 audio
            $channels = 2; $sampleRate = 96000; $samplesPerCh = 128
            $udp = New-Object System.Net.Sockets.UdpClient
            $sent = 0; $offset = 0
            $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
            while ($stopwatch.ElapsedMilliseconds -lt 15000) {
              $pkt = New-Object System.Collections.ArrayList
              # Magic "VBAN" (LE: 0x56, 0x42, 0x41, 0x4E)
              foreach ($b in @(0x56,0x42,0x41,0x4E)) { [void]$pkt.Add([byte]$b) }
              # format_SR: index 4 = 96000 Hz, protocol audio = 0x00
              [void]$pkt.Add([byte]4)
              # format_nbs: samples-1 = 127
              [void]$pkt.Add([byte]($samplesPerCh - 1))
              # format_nbc: channels-1 = 1
              [void]$pkt.Add([byte]($channels - 1))
              # format_bit: INT16 (1) | codec PCM (0x00)
              [void]$pkt.Add([byte]1)
              # Stream name "engineer" (16 bytes, null-padded)
              $name = [System.Text.Encoding]::ASCII.GetBytes("engineer")
              foreach ($b in $name) { [void]$pkt.Add($b) }
              for ($i = 0; $i -lt (16 - $name.Length); $i++) { [void]$pkt.Add([byte]0) }
              # Frame counter (u32 LE)
              foreach ($b in [BitConverter]::GetBytes([uint32]$sent)) { [void]$pkt.Add($b) }
              # Audio: interleaved INT16
              for ($i = 0; $i -lt $samplesPerCh; $i++) {
                $t = ($offset + $i) / $sampleRate
                $val = 0.3 * [Math]::Sin(2 * [Math]::PI * 440 * $t)
                $int16Val = [int16][Math]::Round($val * 32767)
                $sampleBytes = [BitConverter]::GetBytes($int16Val)
                for ($ch = 0; $ch -lt $channels; $ch++) {
                  foreach ($b in $sampleBytes) { [void]$pkt.Add($b) }
                }
              }
              $data = [byte[]]$pkt.ToArray()
              $udp.Send($data, $data.Length, "127.0.0.1", 6980) | Out-Null
              $offset += $samplesPerCh; $sent++
              Start-Sleep -Milliseconds 5
            }
            $udp.Close()
            Write-Output "Sent $sent VBAN UDP packets"
          }
          Write-Host "Started background VBAN UDP sender"
          Start-Sleep -Seconds 2  # Let pipeline initialize

          # Step 3: Get engineer JWT token
          $authBody = '{"member":"engineer","pin":"1177"}'
          $authResp = Invoke-WebRequest -Uri "http://localhost:80/api/auth" -Method POST -Body $authBody -ContentType "application/json" -UseBasicParsing
          $token = ($authResp.Content | ConvertFrom-Json).token
          if (-not $token) {
            Write-Host "::error::Failed to get engineer token"
            exit 1
          }
          Write-Host "Got engineer JWT token"

          # Step 4: Connect WebSocket and verify Opus frames arrive
          # Using .NET ClientWebSocket for binary frame detection
          $ws = New-Object System.Net.WebSockets.ClientWebSocket
          $uri = [Uri]"ws://localhost:80/ws/audio?token=$token"
          $ct = New-Object System.Threading.CancellationTokenSource(15000)

          try {
            $ws.ConnectAsync($uri, $ct.Token).Wait()
            Write-Host "WebSocket connected to /ws/audio"
          } catch {
            Write-Host "::error::WebSocket connection failed: $_"
            Stop-Job $udpJob -ErrorAction SilentlyContinue
            exit 1
          }

          # Send ListenStart
          $msg = [System.Text.Encoding]::UTF8.GetBytes('{"cmd":"ListenStart"}')
          $segment = New-Object System.ArraySegment[byte]($msg, 0, $msg.Length)
          $ws.SendAsync($segment, [System.Net.WebSockets.WebSocketMessageType]::Text, $true, $ct.Token).Wait()
          Write-Host "Sent ListenStart command"

          # Read messages - count binary (Opus) frames
          $binaryFrames = 0
          $textMessages = @()
          $gotListening = $false
          $gotNoSource = $false
          $readBuf = New-Object byte[] 65536
          $readSegment = New-Object System.ArraySegment[byte]($readBuf, 0, $readBuf.Length)
          $deadline = [DateTime]::UtcNow.AddSeconds(12)

          while ([DateTime]::UtcNow -lt $deadline -and $binaryFrames -lt 5) {
            try {
              $readCt = New-Object System.Threading.CancellationTokenSource(3000)
              $result = $ws.ReceiveAsync($readSegment, $readCt.Token).GetAwaiter().GetResult()

              if ($result.MessageType -eq [System.Net.WebSockets.WebSocketMessageType]::Binary) {
                $binaryFrames++
                Write-Host "  Binary frame #$binaryFrames ($($result.Count) bytes)"
              }
              elseif ($result.MessageType -eq [System.Net.WebSockets.WebSocketMessageType]::Text) {
                $text = [System.Text.Encoding]::UTF8.GetString($readBuf, 0, $result.Count)
                $textMessages += $text
                Write-Host "  Text: $text"
                if ($text -match '"listening"') { $gotListening = $true }
                if ($text -match '"no_source"') { $gotNoSource = $true }
              }
              elseif ($result.MessageType -eq [System.Net.WebSockets.WebSocketMessageType]::Close) {
                Write-Host "WebSocket closed by server"
                break
              }
            } catch {
              # Timeout reading - continue loop
            }
          }

          # Cleanup
          try { $ws.CloseAsync([System.Net.WebSockets.WebSocketCloseStatus]::NormalClosure, "", [System.Threading.CancellationToken]::None).Wait() } catch {}
          $udpResult = Receive-Job $udpJob -Wait -ErrorAction SilentlyContinue
          Stop-Job $udpJob -ErrorAction SilentlyContinue
          Write-Host "UDP sender: $udpResult"

          # Verdict
          Write-Host ""
          Write-Host "=== AUDIO PIPELINE TEST RESULTS ==="
          Write-Host "Binary Opus frames received: $binaryFrames"
          Write-Host "Got 'listening' status: $gotListening"
          Write-Host "Got 'no_source' status: $gotNoSource"
          Write-Host "Text messages: $($textMessages.Count)"

          if ($binaryFrames -ge 5 -and $gotListening) {
            Write-Host "AUDIO PIPELINE: PASS (${binaryFrames} Opus frames delivered via WebSocket)"
            exit 0
          } elseif ($binaryFrames -gt 0) {
            Write-Host "::warning::Partial success: got $binaryFrames frames but expected >=5"
            exit 0
          } elseif ($gotNoSource) {
            Write-Host "::error::AUDIO PIPELINE FAIL: Got 'no_source' - VBAN UDP packets not reaching audio pipeline"
            Write-Host "Check: Is VBAN IEM sending to 127.0.0.1:6980? Is the UDP listener bound?"
            exit 1
          } else {
            Write-Host "::error::AUDIO PIPELINE FAIL: No binary frames and no status - WebSocket not responding"
            exit 1
          }

      - name: Test REAL audio from REAPER (no synthetic UDP)
        shell: powershell
        run: |
          # This test verifies REAL VBAN audio from REAPER reaches the app.
          # It does NOT send synthetic UDP — it relies on REAPER's VBAN IEM VST3
          # being active on the engineer track, sending to 127.0.0.1:6980.
          # FAILS the deploy if REAPER was running and VBAN setup succeeded but no audio arrives.

          $wasRunning = "${{ steps.reaper-pre.outputs.was_running }}"
          if ($wasRunning -ne "true") {
            Write-Host "::warning::REAPER was not running before deploy — skipping real audio test"
            exit 0
          }

          $ErrorActionPreference = "Stop"

          # Authenticate as engineer
          $authBody = '{"member":"engineer","pin":"1177"}'
          $authResp = Invoke-WebRequest -Uri "http://localhost:80/api/auth" -Method POST -Body $authBody -ContentType "application/json" -UseBasicParsing
          $token = ($authResp.Content | ConvertFrom-Json).token
          if (-not $token) {
            Write-Host "::error::REAL AUDIO: Cannot authenticate as engineer"
            exit 1
          }

          # Connect WebSocket — no synthetic UDP, only real REAPER audio
          $ws = New-Object System.Net.WebSockets.ClientWebSocket
          $uri = [Uri]"ws://localhost:80/ws/audio?token=$token"
          $ct = New-Object System.Threading.CancellationTokenSource(15000)

          try {
            $ws.ConnectAsync($uri, $ct.Token).Wait()
          } catch {
            Write-Host "::error::REAL AUDIO: WebSocket connection failed: $($_.Exception.Message)"
            exit 1
          }

          # Send ListenStart
          $msg = [System.Text.Encoding]::UTF8.GetBytes('{"cmd":"ListenStart"}')
          $segment = New-Object System.ArraySegment[byte]($msg, 0, $msg.Length)
          $ws.SendAsync($segment, [System.Net.WebSockets.WebSocketMessageType]::Text, $true, $ct.Token).Wait()

          # Wait up to 10 seconds for REAL binary Opus frames
          $readBuf = New-Object byte[] 65536
          $readSegment = New-Object System.ArraySegment[byte]($readBuf, 0, $readBuf.Length)
          $binaryFrames = 0
          $deadline = [DateTime]::UtcNow.AddSeconds(10)

          while ([DateTime]::UtcNow -lt $deadline -and $binaryFrames -lt 3) {
            try {
              $readCt = New-Object System.Threading.CancellationTokenSource(3000)
              $result = $ws.ReceiveAsync($readSegment, $readCt.Token).GetAwaiter().GetResult()
              if ($result.MessageType -eq [System.Net.WebSockets.WebSocketMessageType]::Binary) {
                $binaryFrames++
              }
            } catch {}
          }

          try { $ws.CloseAsync([System.Net.WebSockets.WebSocketCloseStatus]::NormalClosure, "", [System.Threading.CancellationToken]::None).Wait() } catch {}

          if ($binaryFrames -ge 3) {
            Write-Host "REAL AUDIO E2E: PASS ($binaryFrames Opus frames from REAPER via VBAN)"
          } else {
            Write-Host "::error::REAL AUDIO E2E FAIL: Expected 3+ Opus frames, got $binaryFrames"
            Write-Host "::error::REAPER was running and VBAN setup should have succeeded — audio pipeline is broken"
            exit 1
          }

      - name: Verify deployment
        shell: powershell
        run: |
          $proc = Get-Process -Name "iem-mixer-app" -ErrorAction SilentlyContinue
          if (-not $proc) {
            Write-Host "::error::App process not running"
            exit 1
          }
          Write-Host "App running: PID $($proc.Id), Session $($proc.SessionId)"

          # Verify version matches this commit
          $expected_hash = (git rev-parse --short HEAD).Trim()
          $maxRetries = 8
          $retryDelay = 5

          for ($i = 1; $i -le $maxRetries; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:80/api/version" -UseBasicParsing
              $version = $response.Content | ConvertFrom-Json

              Write-Host "Expected: $expected_hash"
              Write-Host "Deployed: $($version.git_hash)"

              if ($version.git_hash -eq "unknown") {
                Write-Host "::error::GIT_HASH is 'unknown' - build.rs did not set version info!"
                exit 1
              }

              if ($version.git_hash -ne $expected_hash) {
                Write-Host "::error::VERSION MISMATCH! Expected $expected_hash but got $($version.git_hash)"
                exit 1
              }

              Write-Host "Version verified: $($version.full_version)"

              # Also test landing page and API
              $landing = Invoke-WebRequest -Uri "http://localhost:80/" -UseBasicParsing
              Write-Host "Landing page: OK (status $($landing.StatusCode))"

              $members = Invoke-WebRequest -Uri "http://localhost:80/api/members" -UseBasicParsing
              $memberData = $members.Content | ConvertFrom-Json
              Write-Host "API members: $($memberData.Count) members loaded"

              # Also verify HTTPS if cert was deployed
              $configDir = [Environment]::GetFolderPath('ApplicationData') + "\iem-mixer"
              if (Test-Path "$configDir\cert.pem") {
                try {
                  $httpsResp = Invoke-WebRequest -Uri "https://iem.newlevel.media/api/version" -UseBasicParsing
                  Write-Host "HTTPS verified: OK"
                } catch {
                  Write-Host "::warning::HTTPS not responding (cert may need DNS propagation)"
                }
              }

              Write-Host "Deployment fully verified!"
              exit 0
            } catch {
              Write-Host "Attempt ${i}: $_"
              if ($i -eq $maxRetries) {
                # Dump full log on final failure for debugging
                Write-Host "=== FULL APP LOG ON FAILURE ==="
                $logDir = [Environment]::GetFolderPath('ApplicationData') + "\iem-mixer\logs"
                if (Test-Path $logDir) {
                  Get-ChildItem $logDir -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1 | ForEach-Object {
                    Get-Content $_.FullName -Tail 100 | ForEach-Object { Write-Host "  $_" }
                  }
                }
                Write-Host "=== ALL LISTENING PORTS ==="
                netstat -an | Select-String "LISTENING" | ForEach-Object { Write-Host "  $_" }
                Write-Host "=== END DEBUG ==="
                Write-Host "::error::App is running but HTTP endpoints not responding"
                exit 1
              }
              Start-Sleep -Seconds $retryDelay
            }
          }
