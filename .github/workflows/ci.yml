      - name: Backup REAPER project
        shell: powershell
        run: |
          # Auto-backup REAPER project + mixer data to the 'backup' branch.
          # CRITICAL: Uses a separate git worktree so the main repo working tree
          # is NEVER switched away from main. Previous approach used git checkout
          # to switch branches in-place, which DELETED projects/sunday_service.RPP
          # from disk every deploy - causing total mix loss on REAPER restart.
          $repoPath = "C:\Users\newlevel\Documents\reaperiem"
          $wtPath = "$env:TEMP\reaperiem-backup-wt"

          Push-Location $repoPath

          # Clean up any stale worktree from a previous failed run
          git worktree prune 2>$null
          if (Test-Path $wtPath) { Remove-Item $wtPath -Recurse -Force }

          # Delete local backup branch if it exists (we recreate from origin)
          $ErrorActionPreference = "SilentlyContinue"
          git branch -D backup 2>&1 | Out-Null
          $ErrorActionPreference = "Stop"

          git fetch origin

          # Create a temporary worktree for the backup branch
          $backupExists = git ls-remote --heads origin backup
          if ($backupExists) {
            git worktree add -b backup $wtPath origin/backup
          } else {
            git worktree add --orphan -b backup $wtPath
          }

          # Copy REAPER projects into the worktree (main repo is untouched)
          if (Test-Path "projects") {
            if (Test-Path "$wtPath\projects") { Remove-Item "$wtPath\projects" -Recurse -Force }
            Copy-Item "projects" "$wtPath\projects" -Recurse -Force
            Write-Host "Collected projects/"
          }

          # Copy mixer data into the worktree
          $appData = "$env:APPDATA\iem-mixer"
          if (Test-Path "$wtPath\data") { Remove-Item "$wtPath\data" -Recurse -Force }
          New-Item -ItemType Directory -Path "$wtPath\data" -Force | Out-Null
          if (Test-Path "$appData\snapshots") {
            New-Item -ItemType Directory -Path "$wtPath\data\snapshots" -Force | Out-Null
            Copy-Item "$appData\snapshots\*" "$wtPath\data\snapshots\" -Force
            Write-Host "Collected snapshots"
          }
          if (Test-Path "$appData\presets") {
            New-Item -ItemType Directory -Path "$wtPath\data\presets" -Force | Out-Null
            Copy-Item "$appData\presets\*" "$wtPath\data\presets\" -Force
            Write-Host "Collected presets"
          }
          if (Test-Path "$appData\pins.json") {
            Copy-Item "$appData\pins.json" "$wtPath\data\pins.json" -Force
            Write-Host "Collected pins.json"
          }

          # Commit and push from the worktree
          Push-Location $wtPath
          git add projects/ data/
          $status = git status --porcelain
          if ($status) {
            Write-Host "Changes detected:"
            Write-Host $status

            $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm"
            git commit -m "backup: REAPER project + mixer data $timestamp

          Co-Authored-By: GitHub Actions <actions@github.com>"

            git push origin backup --force
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Failed to push backup to GitHub"
              Pop-Location; Pop-Location
              exit 1
            }

            # Verify push succeeded
            $localHash = git rev-parse HEAD
            $remoteInfo = git ls-remote origin backup
            $remoteHash = ($remoteInfo -split "`t")[0]
            if ($localHash -ne $remoteHash) {
              Write-Host "::error::Backup verification failed - remote ($remoteHash) doesn't match local ($localHash)"
              Pop-Location; Pop-Location
              exit 1
            }
            Write-Host "Backup pushed and verified: $localHash"
          } else {
            Write-Host "No changes to backup"
          }
          Pop-Location

          # Clean up: remove worktree and local backup branch
          # Main repo stays on main, project files on disk are UNTOUCHED
          git worktree remove $wtPath --force 2>$null
          if (Test-Path $wtPath) { Remove-Item $wtPath -Recurse -Force }
          $ErrorActionPreference = "SilentlyContinue"
          git branch -D backup 2>&1 | Out-Null
          $ErrorActionPreference = "Stop"

          Pop-Location
          exit 0

