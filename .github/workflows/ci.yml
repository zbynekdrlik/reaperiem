name: CI

on:
  push:
    branches: [main, dev]
    paths:
      - "iem-mixer/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "iem-mixer/**"
      - ".github/workflows/ci.yml"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Cancel in-progress runs for same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # TEST INTEGRITY - Ensure tests aren't skipped/ignored
  # ============================================================
  test-integrity:
    name: Test Integrity Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for ignored tests
        run: |
          echo "Checking for #[ignore] in Rust tests..."
          IGNORED=$(grep -r "#\[ignore\]" iem-mixer/crates iem-mixer/src-tauri 2>/dev/null || true)
          if [ -n "$IGNORED" ]; then
            echo "::error::Found ignored tests:"
            echo "$IGNORED"
            exit 1
          fi
          echo "No ignored tests found"

      - name: Check for skip patterns
        run: |
          echo "Checking for skip patterns..."
          SKIPPED=$(grep -rE "(\.skip\(|@skip|#\[ignore)" iem-mixer --include="*.rs" --include="*.ts" 2>/dev/null || true)
          if [ -n "$SKIPPED" ]; then
            echo "::error::Found skip patterns:"
            echo "$SKIPPED"
            exit 1
          fi
          echo "No skip patterns found"

      - name: Verify minimum test count
        working-directory: iem-mixer
        run: |
          echo "Counting tests..."
          TEST_COUNT=$(grep -r "#\[test\]" crates src-tauri 2>/dev/null | wc -l)
          echo "Found $TEST_COUNT unit tests"

          MIN_TESTS=10
          if [ "$TEST_COUNT" -lt "$MIN_TESTS" ]; then
            echo "::error::Only $TEST_COUNT tests found, minimum required: $MIN_TESTS"
            exit 1
          fi
          echo "Test count OK: $TEST_COUNT >= $MIN_TESTS"

      - name: Check E2E tests exist
        run: |
          if [ ! -d "iem-mixer/e2e" ]; then
            echo "::error::E2E test directory missing"
            exit 1
          fi
          E2E_COUNT=$(find iem-mixer/e2e -name "*.spec.ts" 2>/dev/null | wc -l)
          if [ "$E2E_COUNT" -lt 1 ]; then
            echo "::error::No E2E test files found"
            exit 1
          fi
          echo "E2E tests exist: $E2E_COUNT test files"

  # ============================================================
  # LINT - Must pass before any builds
  # ============================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            iem-mixer/target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('iem-mixer/**/Cargo.lock') }}

      - name: Check formatting (strict)
        working-directory: iem-mixer
        run: cargo fmt --all -- --check

      - name: Clippy (strict - deny warnings)
        working-directory: iem-mixer
        run: cargo clippy --all-targets -- -D warnings -D clippy::all

  # ============================================================
  # TEST - Unit tests for core and server
  # ============================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            iem-mixer/target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('iem-mixer/**/Cargo.lock') }}

      - name: Create minimal dist folder for rust-embed
        run: |
          mkdir -p iem-mixer/iem-ui/dist
          echo "placeholder" > iem-mixer/iem-ui/dist/index.html

      - name: Run tests
        working-directory: iem-mixer
        run: cargo test -p iem-core -p iem-server

  # ============================================================
  # BUILD WASM - Frontend must build
  # ============================================================
  build-wasm:
    name: Build WASM Frontend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            iem-mixer/iem-ui/target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('iem-mixer/iem-ui/Cargo.lock') }}

      - name: Install Trunk
        run: |
          if ! command -v trunk &> /dev/null; then
            cargo install trunk
          fi

      - name: Build WASM (release)
        working-directory: iem-mixer/iem-ui
        run: trunk build --release

      - name: Verify WASM output
        run: |
          if [ ! -f iem-mixer/iem-ui/dist/index.html ]; then
            echo "ERROR: index.html not found in dist/"
            exit 1
          fi
          if ! ls iem-mixer/iem-ui/dist/*.wasm 1> /dev/null 2>&1; then
            echo "ERROR: No .wasm files found in dist/"
            exit 1
          fi
          echo "WASM build verified:"
          ls -la iem-mixer/iem-ui/dist/

      - name: Upload WASM dist
        uses: actions/upload-artifact@v4
        with:
          name: wasm-dist
          path: iem-mixer/iem-ui/dist/
          retention-days: 1

  # ============================================================
  # E2E TESTS - Browser tests must pass
  # ============================================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test-integrity, build-wasm]
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM dist
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: iem-mixer/iem-ui/dist/

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            iem-mixer/target/
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('iem-mixer/**/Cargo.lock') }}

      - name: Build server
        working-directory: iem-mixer
        run: cargo build --package iem-server --features standalone --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        working-directory: iem-mixer/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Copy config for E2E tests
        working-directory: iem-mixer
        run: |
          cp config/config.production.yaml config.yaml
          echo "Config copied. Members: $(grep -c 'name:' config.yaml 2>/dev/null || echo 0)"

      - name: Start server
        working-directory: iem-mixer
        run: |
          cargo run --package iem-server --features standalone --release &
          # Wait for server to be ready (may take a while if compiling)
          for i in {1..60}; do
            if curl -sf http://localhost:8080/ > /dev/null 2>&1; then
              echo "Server ready after $i seconds"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start within 60 seconds"
          exit 1
        env:
          RUST_LOG: info
          PORT: 8080

      - name: Run E2E tests
        working-directory: iem-mixer/e2e
        run: npx playwright test --reporter=list
        env:
          E2E_BASE_URL: http://localhost:8080

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: iem-mixer/e2e/test-results/

  # ============================================================
  # CHECK VERSION BUMP - Only on PRs to main
  # Compares PR version against main branch version
  # ============================================================
  check-version-bump:
    name: Verify Version Bump
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR version
        id: pr_version
        run: |
          VERSION=$(grep -m1 '^version' iem-mixer/crates/iem-core/Cargo.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "PR version: $VERSION"

      - name: Get main branch version
        id: main_version
        run: |
          VERSION=$(git show origin/main:iem-mixer/crates/iem-core/Cargo.toml | grep -m1 '^version' | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Main branch version: $VERSION"

      - name: Compare versions
        run: |
          PR_VER="${{ steps.pr_version.outputs.version }}"
          MAIN_VER="${{ steps.main_version.outputs.version }}"

          if [ "$PR_VER" = "$MAIN_VER" ]; then
            echo "::error::Version $PR_VER is the same as main branch!"
            echo "::error::Bump version in iem-mixer/crates/iem-core/Cargo.toml before merging."
            echo ""
            echo "Main:  $MAIN_VER"
            echo "PR:    $PR_VER"
            exit 1
          fi
          echo "Version bump verified: $MAIN_VER -> $PR_VER"

  # ============================================================
  # BUILD TAURI - Windows app (all events)
  # ============================================================
  build-tauri:
    name: Build Tauri (Windows)
    runs-on: windows-latest
    needs: [test, build-wasm]
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM dist
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: iem-mixer/iem-ui/dist/

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            iem-mixer/target/
          key: ${{ runner.os }}-cargo-tauri-${{ hashFiles('iem-mixer/**/Cargo.lock') }}

      - name: Install Tauri CLI
        shell: bash
        run: |
          if ! command -v cargo-tauri &> /dev/null; then
            cargo install tauri-cli
          fi

      - name: Build Tauri (release)
        working-directory: iem-mixer/src-tauri
        run: cargo tauri build

      - name: Verify installer exists
        shell: bash
        run: |
          INSTALLER=$(ls iem-mixer/target/release/bundle/nsis/*.exe 2>/dev/null | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "ERROR: NSIS installer not found"
            exit 1
          fi
          echo "Installer found: $INSTALLER"

      - name: Upload Tauri installer
        uses: actions/upload-artifact@v4
        with:
          name: tauri-installer
          path: iem-mixer/target/release/bundle/nsis/*.exe
          retention-days: 1

  # ============================================================
  # DEPLOY TO IEM.LAN - Auto deploy on push to main or dev
  # Uses existing self-hosted runner on iem.lan (Windows)
  # ============================================================
  deploy:
    name: Deploy to iem.lan
    runs-on: [self-hosted, iem-lan]
    needs: [test-integrity, lint, test, build-wasm, build-tauri, e2e]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM dist
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: wasm-dist/

      - name: Download Tauri installer
        uses: actions/download-artifact@v4
        with:
          name: tauri-installer
          path: installer/

      - name: Clean ALL old installations
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"  # Don't fail on cleanup errors

          Write-Host "=== KILLING ALL IEM PROCESSES ==="
          # Kill by multiple name patterns to catch everything
          @("IEM Mixer", "iem-mixer", "iem-mixer-app", "iem-server") | ForEach-Object {
            Get-Process -Name $_ -ErrorAction SilentlyContinue | Stop-Process -Force
          }
          # Also kill by path pattern
          Get-Process | Where-Object { $_.Path -match "iem" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          Write-Host "=== REMOVING ALL OLD INSTALLATIONS ==="
          # ALL known mess locations
          $oldPaths = @(
            "C:\iem-mixer",
            "C:\Program Files\IEM Mixer",
            "C:\Program Files (x86)\IEM Mixer",
            "$env:USERPROFILE\iem-mixer",
            "$env:USERPROFILE\AppData\Local\IEM Mixer",
            "$env:LOCALAPPDATA\IEM Mixer"
          )

          foreach ($path in $oldPaths) {
            if (Test-Path $path) {
              Write-Host "REMOVING: $path"
              Remove-Item -Path $path -Recurse -Force -ErrorAction SilentlyContinue
              if (Test-Path $path) {
                Write-Host "::warning::Could not fully remove $path - may have locked files"
              }
            }
          }

          # Clean any Task Scheduler tasks (suppress errors properly)
          @("IEMMixerStart", "IEMStart") | ForEach-Object {
            & schtasks /Delete /TN $_ /F 2>&1 | Out-Null
          }

          Write-Host "=== CLEANUP COMPLETE ==="
          # Explicitly exit with 0 - schtasks returns non-zero when task doesn't exist
          exit 0

      - name: Install and start IEM Mixer
        shell: powershell
        env:
          TLS_CERT_PEM: ${{ secrets.TLS_CERT_PEM }}
          TLS_KEY_PEM: ${{ secrets.TLS_KEY_PEM }}
        run: |
          $ErrorActionPreference = "Stop"  # Fail on ANY error

          # Verify installer exists
          $installer = Get-ChildItem -Path "installer" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            Write-Host "::error::No installer found in artifact!"
            exit 1
          }
          Write-Host "Running installer: $($installer.FullName)"

          # Run installer with timeout
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            Write-Host "::error::Installer failed with exit code $($process.ExitCode)"
            exit 1
          }
          Write-Host "Installation complete"

          # Verify installation - find where NSIS actually installed
          $appData = [Environment]::GetFolderPath('LocalApplicationData')
          Write-Host "=== DEBUG: Searching for installed app ==="
          Write-Host "LocalAppData: $appData"

          # List common locations
          @("$appData\IEM Mixer", "$appData\Programs\IEM Mixer", "$appData\iem-mixer") | ForEach-Object {
            if (Test-Path $_) {
              Write-Host "Found: $_"
              Get-ChildItem $_ -Recurse | ForEach-Object { Write-Host "  $($_.FullName)" }
            }
          }

          # Also check what directories exist with "IEM" or "iem" in name
          Get-ChildItem $appData -Directory | Where-Object { $_.Name -match "iem" } | ForEach-Object {
            Write-Host "Directory match: $($_.FullName)"
            Get-ChildItem $_.FullName | ForEach-Object { Write-Host "  $($_.Name)" }
          }

          # Try multiple possible paths (iem-mixer-app.exe is the actual binary name from Cargo.toml)
          $installDir = $null
          $exePath = $null
          $possiblePaths = @(
            "$appData\IEM Mixer\iem-mixer-app.exe",
            "$appData\IEM Mixer\IEM Mixer.exe",
            "$appData\IEM Mixer\iem-mixer.exe",
            "$appData\Programs\IEM Mixer\IEM Mixer.exe",
            "$appData\iem-mixer\iem-mixer.exe"
          )

          foreach ($path in $possiblePaths) {
            if (Test-Path $path) {
              $exePath = $path
              $installDir = Split-Path $path
              Write-Host "Found executable at: $exePath"
              break
            }
          }

          if (-not $exePath) {
            Write-Host "::error::Installation failed - executable not found in any expected location"
            Write-Host "Searched paths:"
            $possiblePaths | ForEach-Object { Write-Host "  $_" }
            exit 1
          }

          # Copy config to the app's expected location (%APPDATA%\iem-mixer\config.yaml)
          $configDir = [Environment]::GetFolderPath('ApplicationData') + "\iem-mixer"
          if (-not (Test-Path $configDir)) {
            New-Item -ItemType Directory -Path $configDir -Force | Out-Null
          }
          Copy-Item "iem-mixer\config\config.production.yaml" "$configDir\config.yaml" -Force

          # Deploy TLS certificates from GitHub secrets (for HTTPS/PWA)
          $tlsCert = "$env:TLS_CERT_PEM"
          $tlsKey = "$env:TLS_KEY_PEM"
          if ($tlsCert -and $tlsKey) {
            [System.IO.File]::WriteAllText("$configDir\cert.pem", $tlsCert)
            [System.IO.File]::WriteAllText("$configDir\key.pem", $tlsKey)
            Write-Host "TLS certificates deployed to $configDir"
          } else {
            Write-Host "::warning::TLS secrets not set - HTTPS will not be available"
          }
          if (-not (Test-Path "$configDir\config.yaml")) {
            Write-Host "::error::Config copy failed"
            exit 1
          }
          Write-Host "Config deployed to $configDir\config.yaml"

          # Reserve ports 80 and 443 for non-admin use (idempotent)
          Write-Host "Ensuring port 80 URL ACL..."
          & netsh http add urlacl url=http://+:80/ user=$env:USERNAME 2>&1 | Out-Null
          Write-Host "Ensuring port 443 URL ACL..."
          & netsh http add urlacl url=https://+:443/ user=$env:USERNAME 2>&1 | Out-Null

          # Start app via Task Scheduler using PowerShell cmdlets for reliable path handling
          # Register-ScheduledTask handles paths with spaces correctly (unlike schtasks.exe)
          # LogonType Interactive = runs in user's desktop session (needed for tray icon)
          $taskName = "IEMMixerStart"
          $appDir = Split-Path $exePath
          Write-Host "Creating scheduled task to start: $exePath"
          Write-Host "Working directory: $appDir"

          # Remove existing task
          Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue

          # Create task with explicit working directory and interactive logon
          $action = New-ScheduledTaskAction -Execute $exePath -WorkingDirectory $appDir
          $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddMinutes(1)
          $principal = New-ScheduledTaskPrincipal -UserId $env:USERNAME -LogonType Interactive
          $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Days 365)

          Register-ScheduledTask -TaskName $taskName -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force
          Write-Host "Task registered successfully"

          # Start the task immediately
          Start-ScheduledTask -TaskName $taskName
          Write-Host "Task triggered, waiting for app to start..."
          Start-Sleep -Seconds 10

          # Check if process is running
          $proc = Get-Process -Name "iem-mixer-app" -ErrorAction SilentlyContinue
          if ($proc) {
            Write-Host "Process running: PID $($proc.Id)"
          } else {
            Write-Host "::warning::Process not found after 10 seconds"
            # Check task status for debugging
            $taskInfo = Get-ScheduledTaskInfo -TaskName $taskName -ErrorAction SilentlyContinue
            if ($taskInfo) {
              Write-Host "Task last run: $($taskInfo.LastRunTime)"
              Write-Host "Task last result: $($taskInfo.LastTaskResult)"
              # 0x80070002 = FILE_NOT_FOUND, 0x41301 = TASK_RUNNING, 0 = SUCCESS
              if ($taskInfo.LastTaskResult -eq 0) {
                Write-Host "Task completed successfully but process not found - app may have crashed"
              } elseif ($taskInfo.LastTaskResult -eq 267009) {
                Write-Host "Task is still running..."
              } else {
                Write-Host "Task failed with error code: 0x$([Convert]::ToString($taskInfo.LastTaskResult, 16))"
              }
            }
            # Show user session info
            Write-Host "=== Active user sessions ==="
            & query user 2>&1 | ForEach-Object { Write-Host "  $_" }
          }

          # Check if port is listening
          $portCheck = netstat -an | Select-String "LISTENING" | Select-String ":80 "
          if ($portCheck) {
            Write-Host "Port 80 listening:"
            $portCheck | ForEach-Object { Write-Host "  $_" }
          } else {
            Write-Host "::warning::Port 80 not listening yet"
          }

          Write-Host "Installation and startup attempt complete"

      - name: Deploy WASM to REAPER www root
        shell: cmd
        run: |
          xcopy /E /Y wasm-dist\* "C:\Program Files\REAPER (x64)\Plugins\reaper_www_root\iem-mixer\"
          echo WASM deployed to REAPER www root

      - name: Verify WASM deployment
        shell: cmd
        run: |
          if exist "C:\Program Files\REAPER (x64)\Plugins\reaper_www_root\iem-mixer\index.html" (
            echo WASM deployment verified!
          ) else (
            echo ERROR: WASM not found
            exit /b 1
          )

      - name: Verify deployment files
        shell: powershell
        run: |
          $appData = [Environment]::GetFolderPath('LocalApplicationData')
          $configDir = [Environment]::GetFolderPath('ApplicationData') + "\iem-mixer"
          $installDir = "$appData\IEM Mixer"

          # Verify installation (binary is iem-mixer-app.exe from Cargo.toml)
          if (Test-Path "$installDir\iem-mixer-app.exe") {
            Write-Host "App installed: $installDir\iem-mixer-app.exe"
          } else {
            Write-Host "::error::App not installed"
            exit 1
          }

          # Verify config exists (at %APPDATA%\iem-mixer\config.yaml)
          if (Test-Path "$configDir\config.yaml") {
            Write-Host "Config deployed: $configDir\config.yaml"
          } else {
            Write-Host "::error::Config not found at $configDir\config.yaml"
            exit 1
          }

          Write-Host "Installation verified successfully"

      - name: Verify app is running and serving
        shell: powershell
        run: |
          # Check if process is running (may not be if user isn't logged into desktop)
          $proc = Get-Process -Name "iem-mixer-app" -ErrorAction SilentlyContinue
          if (-not $proc) {
            Write-Host "::warning::App process not running - user may not have active desktop session"
            Write-Host "App will start at next login via startup shortcut."
            Write-Host "Skipping HTTP verification."
            exit 0
          }
          Write-Host "App running (PID: $($proc.Id))"

          # Dump app logs for diagnostics
          Write-Host "=== APP LOG (last 50 lines) ==="
          $logDir = [Environment]::GetFolderPath('ApplicationData') + "\iem-mixer\logs"
          if (Test-Path $logDir) {
            $latestLog = Get-ChildItem $logDir -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($latestLog) {
              Write-Host "Log file: $($latestLog.FullName)"
              Get-Content $latestLog.FullName -Tail 50 | ForEach-Object { Write-Host "  $_" }
            } else {
              Write-Host "No log files found in $logDir"
            }
          } else {
            Write-Host "Log directory not found: $logDir"
          }
          Write-Host "=== END APP LOG ==="

          # Check all listening ports
          Write-Host "=== LISTENING PORTS ==="
          netstat -an | Select-String "LISTENING" | Select-String ":80 |:443 |:8080 " | ForEach-Object { Write-Host "  $_" }
          Write-Host "=== END PORTS ==="

          # App is running - verify it's serving correctly
          $expected_hash = (git rev-parse --short HEAD).Trim()
          $maxRetries = 8
          $retryDelay = 5

          for ($i = 1; $i -le $maxRetries; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:80/api/version" -UseBasicParsing
              $version = $response.Content | ConvertFrom-Json

              Write-Host "Expected: $expected_hash"
              Write-Host "Deployed: $($version.git_hash)"

              if ($version.git_hash -eq "unknown") {
                Write-Host "::error::GIT_HASH is 'unknown' - build.rs did not set version info!"
                exit 1
              }

              if ($version.git_hash -ne $expected_hash) {
                Write-Host "::error::VERSION MISMATCH! Expected $expected_hash but got $($version.git_hash)"
                exit 1
              }

              Write-Host "Version verified: $($version.full_version)"

              # Also test landing page and API
              $landing = Invoke-WebRequest -Uri "http://localhost:80/" -UseBasicParsing
              Write-Host "Landing page: OK (status $($landing.StatusCode))"

              $members = Invoke-WebRequest -Uri "http://localhost:80/api/members" -UseBasicParsing
              $memberData = $members.Content | ConvertFrom-Json
              Write-Host "API members: $($memberData.Count) members loaded"

              # Also verify HTTPS if cert was deployed
              $configDir = [Environment]::GetFolderPath('ApplicationData') + "\iem-mixer"
              if (Test-Path "$configDir\cert.pem") {
                try {
                  $httpsResp = Invoke-WebRequest -Uri "https://iem.newlevel.media/api/version" -UseBasicParsing
                  Write-Host "HTTPS verified: OK"
                } catch {
                  Write-Host "::warning::HTTPS not responding (cert may need DNS propagation)"
                }
              }

              Write-Host "Deployment fully verified!"
              exit 0
            } catch {
              Write-Host "Attempt ${i}: $_"
              if ($i -eq $maxRetries) {
                # Dump full log on final failure for debugging
                Write-Host "=== FULL APP LOG ON FAILURE ==="
                $logDir = [Environment]::GetFolderPath('ApplicationData') + "\iem-mixer\logs"
                if (Test-Path $logDir) {
                  Get-ChildItem $logDir -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1 | ForEach-Object {
                    Get-Content $_.FullName -Tail 100 | ForEach-Object { Write-Host "  $_" }
                  }
                }
                Write-Host "=== ALL LISTENING PORTS ==="
                netstat -an | Select-String "LISTENING" | ForEach-Object { Write-Host "  $_" }
                Write-Host "=== END DEBUG ==="
                Write-Host "::error::App is running but HTTP endpoints not responding"
                exit 1
              }
              Start-Sleep -Seconds $retryDelay
            }
          }
