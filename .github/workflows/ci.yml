name: CI
# CSP fix for Trunk inline scripts

on:
  push:
    branches: [main, dev]
    paths:
      - "iem-mixer/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "iem-mixer/**"
      - ".github/workflows/ci.yml"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Cancel in-progress runs for same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # TEST INTEGRITY - Ensure tests aren't skipped/ignored
  # ============================================================
  test-integrity:
    name: Test Integrity Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check for ignored tests
        run: |
          echo "Checking for #[ignore] in Rust tests..."
          IGNORED=$(grep -r "#\[ignore\]" iem-mixer/crates iem-mixer/src-tauri 2>/dev/null || true)
          if [ -n "$IGNORED" ]; then
            echo "::error::Found ignored tests:"
            echo "$IGNORED"
            exit 1
          fi
          echo "No ignored tests found"

      - name: Check for skip patterns
        run: |
          echo "Checking for skip patterns..."
          SKIPPED=$(grep -rE "(\.skip\(|@skip|#\[ignore)" iem-mixer --include="*.rs" --include="*.ts" 2>/dev/null || true)
          if [ -n "$SKIPPED" ]; then
            echo "::error::Found skip patterns:"
            echo "$SKIPPED"
            exit 1
          fi
          echo "No skip patterns found"

      - name: Verify minimum test count
        working-directory: iem-mixer
        run: |
          echo "Counting tests..."
          TEST_COUNT=$(grep -r "#\[test\]" crates src-tauri 2>/dev/null | wc -l)
          echo "Found $TEST_COUNT unit tests"

          MIN_TESTS=10
          if [ "$TEST_COUNT" -lt "$MIN_TESTS" ]; then
            echo "::error::Only $TEST_COUNT tests found, minimum required: $MIN_TESTS"
            exit 1
          fi
          echo "Test count OK: $TEST_COUNT >= $MIN_TESTS"

      - name: Check E2E tests exist
        run: |
          if [ ! -d "iem-mixer/e2e" ]; then
            echo "::error::E2E test directory missing"
            exit 1
          fi
          E2E_COUNT=$(find iem-mixer/e2e -name "*.spec.ts" 2>/dev/null | wc -l)
          if [ "$E2E_COUNT" -lt 1 ]; then
            echo "::error::No E2E test files found"
            exit 1
          fi
          echo "E2E tests exist: $E2E_COUNT test files"

      - name: Ban ShowConsoleMsg in deferred ReaScripts
        run: |
          echo "Checking for ShowConsoleMsg in production ReaScripts..."
          # meter_bridge.lua runs continuously via defer() - console output
          # opens REAPER's console window, grabs focus, and blocks HTTP API.
          # One-shot scripts (set_hardware_output, setup, test) are exempt.
          BANNED_FILES="scripts/reascripts/meter_bridge.lua"
          FOUND=""
          for f in $BANNED_FILES; do
            HITS=$(grep -n "ShowConsoleMsg" "$f" 2>/dev/null || true)
            if [ -n "$HITS" ]; then
              FOUND="$FOUND\n$f:\n$HITS"
            fi
          done
          if [ -n "$FOUND" ]; then
            echo "::error::ShowConsoleMsg found in deferred ReaScripts (blocks REAPER HTTP API):"
            echo -e "$FOUND"
            exit 1
          fi
          echo "No ShowConsoleMsg in deferred ReaScripts"

  # ============================================================
  # LINT - Must pass before any builds
  # ============================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            iem-mixer/target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('iem-mixer/**/Cargo.lock') }}

      - name: Check formatting (strict)
        working-directory: iem-mixer
        run: cargo fmt --all -- --check

      - name: Clippy (strict - deny warnings)
        working-directory: iem-mixer
        run: cargo clippy --all-targets -- -D warnings -D clippy::all

  # ============================================================
  # TEST - Unit tests for core and server
  # ============================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            iem-mixer/target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('iem-mixer/**/Cargo.lock') }}

      - name: Create minimal dist folder for rust-embed
        run: |
          mkdir -p iem-mixer/iem-ui/dist
          echo "placeholder" > iem-mixer/iem-ui/dist/index.html

      - name: Run tests
        working-directory: iem-mixer
        run: cargo test -p iem-core -p iem-server

  # ============================================================
  # BUILD WASM - Frontend must build
  # ============================================================
  build-wasm:
    name: Build WASM Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            iem-mixer/iem-ui/target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('iem-mixer/iem-ui/Cargo.lock') }}

      - name: Install Trunk
        run: |
          if ! command -v trunk &> /dev/null; then
            cargo install trunk
          fi

      - name: Build WASM (release)
        working-directory: iem-mixer/iem-ui
        run: trunk build --release

      - name: Verify WASM output
        run: |
          if [ ! -f iem-mixer/iem-ui/dist/index.html ]; then
            echo "ERROR: index.html not found in dist/"
            exit 1
          fi
          if ! ls iem-mixer/iem-ui/dist/*.wasm 1> /dev/null 2>&1; then
            echo "ERROR: No .wasm files found in dist/"
            exit 1
          fi
          echo "WASM build verified:"
          ls -la iem-mixer/iem-ui/dist/

      - name: Upload WASM dist
        uses: actions/upload-artifact@v4
        with:
          name: wasm-dist
          path: iem-mixer/iem-ui/dist/
          retention-days: 1

  # ============================================================
  # E2E TESTS - Browser tests must pass
  # ============================================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-integrity, build-wasm]
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM dist
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: iem-mixer/iem-ui/dist/

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            iem-mixer/target/
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('iem-mixer/**/Cargo.lock') }}

      - name: Build server
        working-directory: iem-mixer
        run: cargo build --package iem-server --features standalone --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        working-directory: iem-mixer/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Copy config for E2E tests
        working-directory: iem-mixer
        run: |
          cp config/config.production.yaml config.yaml
          echo "Config copied. Members: $(grep -c 'name:' config.yaml 2>/dev/null || echo 0)"

      - name: Start server
        working-directory: iem-mixer
        run: |
          cargo run --package iem-server --features standalone --release &
          # Wait for server to be ready (may take a while if compiling)
          for i in {1..60}; do
            if curl -sf http://localhost:8080/ > /dev/null 2>&1; then
              echo "Server ready after $i seconds"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start within 60 seconds"
          exit 1
        env:
          RUST_LOG: info
          PORT: 8080

      - name: Run E2E tests
        working-directory: iem-mixer/e2e
        run: npx playwright test --reporter=list
        env:
          E2E_BASE_URL: http://localhost:8080

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: iem-mixer/e2e/test-results/

  # ============================================================
  # CHECK VERSION BUMP - Only on PRs to main
  # Compares PR version against main branch version
  # ============================================================
  check-version-bump:
    name: Verify Version Bump
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR version
        id: pr_version
        run: |
          VERSION=$(grep -m1 '^version' iem-mixer/crates/iem-core/Cargo.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "PR version: $VERSION"

      - name: Get main branch version
        id: main_version
        run: |
          VERSION=$(git show origin/main:iem-mixer/crates/iem-core/Cargo.toml | grep -m1 '^version' | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Main branch version: $VERSION"

      - name: Compare versions
        run: |
          PR_VER="${{ steps.pr_version.outputs.version }}"
          MAIN_VER="${{ steps.main_version.outputs.version }}"

          if [ "$PR_VER" = "$MAIN_VER" ]; then
            echo "::error::Version $PR_VER is the same as main branch!"
            echo "::error::Bump version in iem-mixer/crates/iem-core/Cargo.toml before merging."
            echo ""
            echo "Main:  $MAIN_VER"
            echo "PR:    $PR_VER"
            exit 1
          fi
          echo "Version bump verified: $MAIN_VER -> $PR_VER"

  # ============================================================
  # BUILD TAURI - Windows app (all events)
  # ============================================================
  build-tauri:
    name: Build Tauri (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    needs: [test, build-wasm]
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM dist
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: iem-mixer/iem-ui/dist/

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            iem-mixer/target/
          key: ${{ runner.os }}-cargo-tauri-${{ hashFiles('iem-mixer/**/Cargo.lock') }}

      - name: Install Tauri CLI
        shell: bash
        run: |
          if ! command -v cargo-tauri &> /dev/null; then
            cargo install tauri-cli
          fi

      - name: Build Tauri (release)
        working-directory: iem-mixer/src-tauri
        run: cargo tauri build

      - name: Verify installer exists
        shell: bash
        run: |
          INSTALLER=$(ls iem-mixer/target/release/bundle/nsis/*.exe 2>/dev/null | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "ERROR: NSIS installer not found"
            exit 1
          fi
          echo "Installer found: $INSTALLER"

      - name: Upload Tauri installer
        uses: actions/upload-artifact@v4
        with:
          name: tauri-installer
          path: iem-mixer/target/release/bundle/nsis/*.exe
          retention-days: 1

  # ============================================================
  # DEPLOY TO IEM.LAN - Auto deploy on push to main or dev
  # Uses existing self-hosted runner on iem.lan (Windows)
  # ============================================================
  deploy:
    name: Deploy to iem.lan
    runs-on: [self-hosted, iem-lan]
    timeout-minutes: 10
    needs: [test-integrity, lint, test, build-wasm, build-tauri, e2e]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM dist
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: wasm-dist/

      - name: Download Tauri installer
        uses: actions/download-artifact@v4
        with:
          name: tauri-installer
          path: installer/

      - name: Stop running IEM Mixer
        shell: powershell
        run: |
          # GitHub Actions sets ErrorActionPreference=Stop by default,
          # which makes taskkill's "not found" stderr a terminating error.
          $ErrorActionPreference = "SilentlyContinue"
          & taskkill /f /im iem-mixer-app.exe 2>&1 | Out-Null
          Start-Sleep -Seconds 3
          $ErrorActionPreference = "Stop"
          $proc = Get-Process -Name "iem-mixer-app" -ErrorAction SilentlyContinue
          if ($proc) {
            Write-Host "::error::Cannot stop iem-mixer-app (PID $($proc.Id))"
            exit 1
          }
          Write-Host "Process stopped"
          exit 0

      - name: Install and start IEM Mixer
        shell: powershell
        env:
          TLS_CERT_PEM: ${{ secrets.TLS_CERT_PEM }}
          TLS_KEY_PEM: ${{ secrets.TLS_KEY_PEM }}
        run: |
          $ErrorActionPreference = "Stop"

          # Runner MUST be in an interactive session (session 1+) for tray icon support.
          # The runner is configured as a user-mode app via Startup shortcut, NOT a Windows service.
          $sessionId = [System.Diagnostics.Process]::GetCurrentProcess().SessionId
          Write-Host "Runner session: $sessionId"
          if ($sessionId -eq 0) {
            Write-Host "::error::Runner is in session 0 (service mode). Tray icon will not work."
            Write-Host "::error::Reconfigure runner: stop service, use Startup shortcut for run.cmd"
            exit 1
          }

          # Install
          $installer = Get-ChildItem -Path "installer" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            Write-Host "::error::No installer found in artifact!"
            exit 1
          }
          Write-Host "Running installer: $($installer.FullName)"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            Write-Host "::error::Installer failed with exit code $($process.ExitCode)"
            exit 1
          }

          # Verify installation
          $appData = [Environment]::GetFolderPath('LocalApplicationData')
          $installDir = "$appData\IEM Mixer"
          $exePath = "$installDir\iem-mixer-app.exe"
          if (-not (Test-Path $exePath)) {
            Write-Host "::error::Executable not found at $exePath"
            exit 1
          }
          Write-Host "Installed: $exePath"

          # Deploy config
          $configDir = [Environment]::GetFolderPath('ApplicationData') + "\iem-mixer"
          if (-not (Test-Path $configDir)) {
            New-Item -ItemType Directory -Path $configDir -Force | Out-Null
          }
          Copy-Item "iem-mixer\config\config.production.yaml" "$configDir\config.yaml" -Force
          if (-not (Test-Path "$configDir\config.yaml")) {
            Write-Host "::error::Config copy failed"
            exit 1
          }
          Write-Host "Config: $configDir\config.yaml"

          # Deploy TLS certificates
          $tlsCert = "$env:TLS_CERT_PEM"
          $tlsKey = "$env:TLS_KEY_PEM"
          if ($tlsCert -and $tlsKey) {
            [System.IO.File]::WriteAllText("$configDir\cert.pem", $tlsCert)
            [System.IO.File]::WriteAllText("$configDir\key.pem", $tlsKey)
            Write-Host "TLS certificates deployed"
          } else {
            Write-Host "::warning::TLS secrets not set - HTTPS will not be available"
          }

          # Reserve ports 80 and 443 for non-admin use (idempotent)
          # netsh returns exit code 1 if reservation exists — suppress under SilentlyContinue
          $ErrorActionPreference = "SilentlyContinue"
          & netsh http add urlacl url=http://+:80/ user=$env:USERNAME 2>&1 | Out-Null
          & netsh http add urlacl url=https://+:443/ user=$env:USERNAME 2>&1 | Out-Null
          $ErrorActionPreference = "Stop"

          # Create Startup launcher (ensures clean start on reboot)
          $launcherPath = "$installDir\iem-mixer-launcher.bat"
          $logPath = "$installDir\launcher.log"
          $lines = @(
            "@echo off",
            "echo [%date% %time%] Launcher started >> `"$logPath`"",
            "taskkill /im iem-mixer-app.exe /f >nul 2>&1",
            "ping -n 4 127.0.0.1 >nul",
            "start `"`" `"$exePath`"",
            "echo [%date% %time%] App started >> `"$logPath`""
          )
          [System.IO.File]::WriteAllText($launcherPath, ($lines -join "`r`n"))

          $startupDir = [Environment]::GetFolderPath('Startup')
          $shortcutPath = "$startupDir\IEM Mixer.lnk"
          $ws = New-Object -ComObject WScript.Shell
          $sc = $ws.CreateShortcut($shortcutPath)
          $sc.TargetPath = $launcherPath
          $sc.WorkingDirectory = $installDir
          $sc.WindowStyle = 7
          $sc.Description = "IEM Mixer"
          $sc.Save()
          Write-Host "Startup shortcut: $shortcutPath"

          # Start app via WMI to create a detached process that survives runner cleanup.
          # GitHub Actions kills child processes ("orphans") when the job ends.
          # WMI Win32_Process.Create spawns outside the runner's process tree.
          $result = ([wmiclass]"Win32_Process").Create($exePath)
          if ($result.ReturnValue -ne 0) {
            Write-Host "::error::WMI process creation failed: return $($result.ReturnValue)"
            exit 1
          }
          Write-Host "Started via WMI: PID $($result.ProcessId)"
          Start-Sleep -Seconds 8

          # Verify exactly one process started in interactive session
          $procs = @(Get-Process -Name "iem-mixer-app" -ErrorAction SilentlyContinue)
          if ($procs.Count -eq 0) {
            Write-Host "::error::App process failed to start"
            exit 1
          }
          if ($procs.Count -gt 1) {
            Write-Host "::error::Multiple iem-mixer-app processes found:"
            $procs | ForEach-Object { Write-Host "  PID $($_.Id), Session $($_.SessionId)" }
            exit 1
          }
          $proc = $procs[0]
          Write-Host "App running: PID $($proc.Id), Session $($proc.SessionId)"
          if ($proc.SessionId -eq 0) {
            Write-Host "::error::App started in session 0 - tray icon will not work"
            exit 1
          }
          exit 0

      - name: Deploy WASM to REAPER www root
        shell: cmd
        continue-on-error: true
        run: |
          xcopy /E /Y wasm-dist\* "C:\Program Files\REAPER (x64)\Plugins\reaper_www_root\iem-mixer\"
          echo WASM deployed to REAPER www root

      - name: Verify WASM deployment
        shell: cmd
        continue-on-error: true
        run: |
          if exist "C:\Program Files\REAPER (x64)\Plugins\reaper_www_root\iem-mixer\index.html" (
            echo WASM deployment verified!
          ) else (
            echo WARNING: WASM not deployed to REAPER www root - requires admin access
          )

      - name: Verify deployment
        shell: powershell
        run: |
          $proc = Get-Process -Name "iem-mixer-app" -ErrorAction SilentlyContinue
          if (-not $proc) {
            Write-Host "::error::App process not running"
            exit 1
          }
          Write-Host "App running: PID $($proc.Id), Session $($proc.SessionId)"

          # Verify version matches this commit
          $expected_hash = (git rev-parse --short HEAD).Trim()
          $maxRetries = 8
          $retryDelay = 5

          for ($i = 1; $i -le $maxRetries; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:80/api/version" -UseBasicParsing
              $version = $response.Content | ConvertFrom-Json

              Write-Host "Expected: $expected_hash"
              Write-Host "Deployed: $($version.git_hash)"

              if ($version.git_hash -eq "unknown") {
                Write-Host "::error::GIT_HASH is 'unknown' - build.rs did not set version info!"
                exit 1
              }

              if ($version.git_hash -ne $expected_hash) {
                Write-Host "::error::VERSION MISMATCH! Expected $expected_hash but got $($version.git_hash)"
                exit 1
              }

              Write-Host "Version verified: $($version.full_version)"

              # Also test landing page and API
              $landing = Invoke-WebRequest -Uri "http://localhost:80/" -UseBasicParsing
              Write-Host "Landing page: OK (status $($landing.StatusCode))"

              $members = Invoke-WebRequest -Uri "http://localhost:80/api/members" -UseBasicParsing
              $memberData = $members.Content | ConvertFrom-Json
              Write-Host "API members: $($memberData.Count) members loaded"

              # Also verify HTTPS if cert was deployed
              $configDir = [Environment]::GetFolderPath('ApplicationData') + "\iem-mixer"
              if (Test-Path "$configDir\cert.pem") {
                try {
                  $httpsResp = Invoke-WebRequest -Uri "https://iem.newlevel.media/api/version" -UseBasicParsing
                  Write-Host "HTTPS verified: OK"
                } catch {
                  Write-Host "::warning::HTTPS not responding (cert may need DNS propagation)"
                }
              }

              Write-Host "Deployment fully verified!"
              exit 0
            } catch {
              Write-Host "Attempt ${i}: $_"
              if ($i -eq $maxRetries) {
                # Dump full log on final failure for debugging
                Write-Host "=== FULL APP LOG ON FAILURE ==="
                $logDir = [Environment]::GetFolderPath('ApplicationData') + "\iem-mixer\logs"
                if (Test-Path $logDir) {
                  Get-ChildItem $logDir -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1 | ForEach-Object {
                    Get-Content $_.FullName -Tail 100 | ForEach-Object { Write-Host "  $_" }
                  }
                }
                Write-Host "=== ALL LISTENING PORTS ==="
                netstat -an | Select-String "LISTENING" | ForEach-Object { Write-Host "  $_" }
                Write-Host "=== END DEBUG ==="
                Write-Host "::error::App is running but HTTP endpoints not responding"
                exit 1
              }
              Start-Sleep -Seconds $retryDelay
            }
          }
