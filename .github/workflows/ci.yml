      - name: Test audio pipeline (OIEM UDP to WebSocket Opus frames)
        shell: powershell
        run: |
          # This test PROVES the full audio pipeline works end-to-end:
          #   1. Send synthetic OIEM UDP packets to 127.0.0.1:7980
          #   2. Login as engineer, get JWT
          #   3. Connect WebSocket to ws://localhost:80/ws/audio?token=JWT
          #   4. Send ListenStart command
          #   5. Verify binary Opus frames arrive
          #   FAIL if no binary frames within 15 seconds
          #
          # OIEM packet format: [4B magic "OIEM"] [2B seq LE] [2B payload_size LE] [payload]
          # The server relays the payload directly — no resampling or encoding needed.

          $ErrorActionPreference = "Stop"

          # Verify UDP listener exists on port 7980
          $udpListeners = netstat -an | Select-String "UDP.*:7980"
          if (-not $udpListeners) {
            Write-Host "::error::No UDP listener on port 7980 - app not listening for OIEM"
            exit 1
          }
          Write-Host "UDP 7980 listener found: $udpListeners"

          # Step 1: Start background OIEM UDP sender (keeps sending for 15 seconds)
          # Sends fake Opus-sized payloads (server just relays them)
          $udpJob = Start-Job -ScriptBlock {
            $udp = New-Object System.Net.Sockets.UdpClient
            $sent = 0
            $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
            while ($stopwatch.ElapsedMilliseconds -lt 15000) {
              $pkt = New-Object System.Collections.ArrayList
              # Magic "OIEM"
              foreach ($b in @(0x4F, 0x49, 0x45, 0x4D)) { [void]$pkt.Add([byte]$b) }
              # Sequence number (uint16 LE)
              $seqBytes = [BitConverter]::GetBytes([uint16]($sent % 65536))
              foreach ($b in $seqBytes) { [void]$pkt.Add($b) }
              # Payload: synthetic data mimicking an Opus frame (~200 bytes)
              $payloadSize = 200
              $payloadSizeBytes = [BitConverter]::GetBytes([uint16]$payloadSize)
              foreach ($b in $payloadSizeBytes) { [void]$pkt.Add($b) }
              # Fill with non-zero data (synthetic Opus-like payload)
              for ($i = 0; $i -lt $payloadSize; $i++) {
                [void]$pkt.Add([byte](($sent + $i) % 256))
              }
              $data = [byte[]]$pkt.ToArray()
              $udp.Send($data, $data.Length, "127.0.0.1", 7980) | Out-Null
              $sent++
              # 20ms per frame = 50 frames/sec (matches real Opus timing)
              Start-Sleep -Milliseconds 20
            }
            $udp.Close()
            Write-Output "Sent $sent OIEM UDP packets"
          }
          Write-Host "Started background OIEM UDP sender"
          Start-Sleep -Seconds 2  # Let pipeline initialize

          # Step 2: Get engineer JWT token
          $authBody = '{"member":"engineer","pin":"1177"}'
          $authResp = Invoke-WebRequest -Uri "http://localhost:80/api/auth" -Method POST -Body $authBody -ContentType "application/json" -UseBasicParsing
          $token = ($authResp.Content | ConvertFrom-Json).token
          if (-not $token) {
            Write-Host "::error::Failed to get engineer token"
            exit 1
          }
          Write-Host "Got engineer JWT token"

          # Step 3: Connect WebSocket and verify Opus frames arrive
          $ws = New-Object System.Net.WebSockets.ClientWebSocket
          $uri = [Uri]"ws://localhost:80/ws/audio?token=$token"
          $ct = New-Object System.Threading.CancellationTokenSource(15000)

          try {
            $ws.ConnectAsync($uri, $ct.Token).Wait()
            Write-Host "WebSocket connected to /ws/audio"
          } catch {
            Write-Host "::error::WebSocket connection failed: $_"
            Stop-Job $udpJob -ErrorAction SilentlyContinue
            exit 1
          }

          # Send ListenStart
          $msg = [System.Text.Encoding]::UTF8.GetBytes('{"cmd":"ListenStart","member_id":"engineer"}')
          $segment = New-Object System.ArraySegment[byte]($msg, 0, $msg.Length)
          $ws.SendAsync($segment, [System.Net.WebSockets.WebSocketMessageType]::Text, $true, $ct.Token).Wait()
          Write-Host "Sent ListenStart command"

          # Read messages - count binary (Opus) frames
          $binaryFrames = 0
          $textMessages = @()
          $gotListening = $false
          $gotNoSource = $false
          $readBuf = New-Object byte[] 65536
          $readSegment = New-Object System.ArraySegment[byte]($readBuf, 0, $readBuf.Length)
          $deadline = [DateTime]::UtcNow.AddSeconds(12)

          while ([DateTime]::UtcNow -lt $deadline -and $binaryFrames -lt 5) {
            try {
              $readCt = New-Object System.Threading.CancellationTokenSource(3000)
              $result = $ws.ReceiveAsync($readSegment, $readCt.Token).GetAwaiter().GetResult()

              if ($result.MessageType -eq [System.Net.WebSockets.WebSocketMessageType]::Binary) {
                $binaryFrames++
                Write-Host "  Binary frame #$binaryFrames ($($result.Count) bytes)"
              }
              elseif ($result.MessageType -eq [System.Net.WebSockets.WebSocketMessageType]::Text) {
                $text = [System.Text.Encoding]::UTF8.GetString($readBuf, 0, $result.Count)
                $textMessages += $text
                Write-Host "  Text: $text"
                if ($text -match '"listening"') { $gotListening = $true }
                if ($text -match '"no_source"') { $gotNoSource = $true }
              }
              elseif ($result.MessageType -eq [System.Net.WebSockets.WebSocketMessageType]::Close) {
                Write-Host "WebSocket closed by server"
                break
              }
            } catch {
              # Timeout reading - continue loop
            }
          }

          # Cleanup
          try { $ws.CloseAsync([System.Net.WebSockets.WebSocketCloseStatus]::NormalClosure, "", [System.Threading.CancellationToken]::None).Wait() } catch {}
          $udpResult = Receive-Job $udpJob -Wait -ErrorAction SilentlyContinue
          Stop-Job $udpJob -ErrorAction SilentlyContinue
          Write-Host "UDP sender: $udpResult"

          # Verdict
          Write-Host ""
          Write-Host "=== AUDIO PIPELINE TEST RESULTS ==="
          Write-Host "Binary Opus frames received: $binaryFrames"
          Write-Host "Got 'listening' status: $gotListening"
          Write-Host "Got 'no_source' status: $gotNoSource"
          Write-Host "Text messages: $($textMessages.Count)"

          if ($binaryFrames -ge 5 -and $gotListening) {
            Write-Host "AUDIO PIPELINE: PASS (${binaryFrames} Opus frames delivered via WebSocket)"
            exit 0
          } elseif ($binaryFrames -gt 0) {
            Write-Host "::warning::Partial success: got $binaryFrames frames but expected >=5"
            exit 0
          } elseif ($gotNoSource) {
            Write-Host "::error::AUDIO PIPELINE FAIL: Got 'no_source' - OIEM UDP packets not reaching audio pipeline"
            Write-Host "Check: Is VBAN IEM VST sending OIEM to 127.0.0.1:7980? Is the UDP listener bound?"
            exit 1
          } else {
            Write-Host "::error::AUDIO PIPELINE FAIL: No binary frames and no status - WebSocket not responding"
            exit 1
          }

      - name: Test REAL audio from REAPER (no synthetic UDP)
        shell: powershell
        run: |
          # This test verifies REAL OIEM audio from REAPER reaches the app.
          # It does NOT send synthetic UDP - it relies on REAPER's VBAN IEM VST3
          # being active on the engineer track, sending OIEM Opus to 127.0.0.1:7980.
          # FAILS the deploy if REAPER was running and VST setup succeeded but no audio arrives.

          $wasRunning = "${{ steps.reaper-pre.outputs.was_running }}"
          if ($wasRunning -ne "true") {
            Write-Host "::warning::REAPER was not running before deploy - skipping real audio test"
            exit 0
          }

          $ErrorActionPreference = "Stop"

          # Authenticate as engineer
          $authBody = '{"member":"engineer","pin":"1177"}'
          $authResp = Invoke-WebRequest -Uri "http://localhost:80/api/auth" -Method POST -Body $authBody -ContentType "application/json" -UseBasicParsing
          $token = ($authResp.Content | ConvertFrom-Json).token
          if (-not $token) {
            Write-Host "::error::REAL AUDIO: Cannot authenticate as engineer"
            exit 1
          }

          # Wait for REAPER audio engine to warm up after restart
          # The VST needs time to initialize its UDP sender after REAPER loads
          $warmupDeadline = [DateTime]::UtcNow.AddSeconds(30)
          $audioReady = $false
          while ([DateTime]::UtcNow -lt $warmupDeadline) {
            try {
              $diagResp = Invoke-WebRequest -Uri "http://localhost:80/api/audio/diagnostics" `
                -Headers @{ Authorization = "Bearer $token" } -UseBasicParsing -TimeoutSec 5
              $diag = $diagResp.Content | ConvertFrom-Json
              if ($diag.receiving_oiem -eq $true -and $diag.packets_per_second -gt 10) {
                Write-Host "Audio engine ready: $($diag.packets_per_second) pps"
                $audioReady = $true
                break
              }
            } catch {}
            Start-Sleep -Seconds 2
          }
          if (-not $audioReady) {
            Write-Host "::warning::Audio engine not producing frames after 30s warmup"
          }

          # Connect WebSocket - no synthetic UDP, only real REAPER audio
          $ws = New-Object System.Net.WebSockets.ClientWebSocket
          $uri = [Uri]"ws://localhost:80/ws/audio?token=$token"
          $ct = New-Object System.Threading.CancellationTokenSource(15000)

          try {
            $ws.ConnectAsync($uri, $ct.Token).Wait()
          } catch {
            Write-Host "::error::REAL AUDIO: WebSocket connection failed: $($_.Exception.Message)"
            exit 1
          }

          # Send ListenStart
          $msg = [System.Text.Encoding]::UTF8.GetBytes('{"cmd":"ListenStart","member_id":"engineer"}')
          $segment = New-Object System.ArraySegment[byte]($msg, 0, $msg.Length)
          $ws.SendAsync($segment, [System.Net.WebSockets.WebSocketMessageType]::Text, $true, $ct.Token).Wait()

          # Wait up to 10 seconds for REAL binary Opus frames
          $readBuf = New-Object byte[] 65536
          $readSegment = New-Object System.ArraySegment[byte]($readBuf, 0, $readBuf.Length)
          $binaryFrames = 0
          $deadline = [DateTime]::UtcNow.AddSeconds(10)

          while ([DateTime]::UtcNow -lt $deadline -and $binaryFrames -lt 3) {
            try {
              $readCt = New-Object System.Threading.CancellationTokenSource(3000)
              $result = $ws.ReceiveAsync($readSegment, $readCt.Token).GetAwaiter().GetResult()
              if ($result.MessageType -eq [System.Net.WebSockets.WebSocketMessageType]::Binary) {
                $binaryFrames++
              }
            } catch {}
          }

          try { $ws.CloseAsync([System.Net.WebSockets.WebSocketCloseStatus]::NormalClosure, "", [System.Threading.CancellationToken]::None).Wait() } catch {}

          if ($binaryFrames -ge 3) {
            Write-Host "REAL AUDIO E2E: PASS ($binaryFrames Opus frames from REAPER via OIEM)"
          } else {
            Write-Host "::error::REAL AUDIO E2E FAIL: Expected 3+ Opus frames, got $binaryFrames"
            Write-Host "::error::REAPER was running and VBAN setup should have succeeded - audio pipeline is broken"
            exit 1
          }

      - name: Verify audio signal via diagnostics API
        shell: powershell
        run: |
          # This test verifies ACTUAL AUDIO SIGNAL quality, not just bytes on a wire.
          # Uses /api/audio/diagnostics to check peak_db and opus_frames_per_second.
          # FAILS if audio pipeline produces silence despite having data.

          $token = (Invoke-WebRequest -Uri "http://localhost:80/api/auth" -Method POST `
            -Body '{"member":"engineer","pin":"1177"}' -ContentType "application/json" `
            -UseBasicParsing).Content | ConvertFrom-Json | Select-Object -ExpandProperty token

          # Wait for diagnostics to accumulate (synthetic UDP sender or tone gen already active)
          Start-Sleep -Seconds 3

          $diag = (Invoke-WebRequest -Uri "http://localhost:80/api/audio/diagnostics" `
            -Headers @{ Authorization = "Bearer $token" } -UseBasicParsing).Content | ConvertFrom-Json

          Write-Host "=== AUDIO DIAGNOSTICS ==="
          Write-Host "receiving_oiem: $($diag.receiving_oiem)"
          Write-Host "receiving_vban: $($diag.receiving_vban)"
          Write-Host "packets/s: $($diag.packets_per_second)"
          Write-Host "opus_frames/s: $($diag.opus_frames_per_second)"
          Write-Host "peak_db: $($diag.peak_db)"
          Write-Host "last_sequence: $($diag.last_sequence)"
          Write-Host "sequence_gaps: $($diag.sequence_gaps)"

          if (-not $diag.receiving_vban -and -not $diag.receiving_oiem) {
            Write-Host "::error::AUDIO DIAGNOSTICS FAIL: Not receiving OIEM packets"
            exit 1
          }
          if ($diag.peak_db -lt -40) {
            Write-Host "::error::AUDIO DIAGNOSTICS FAIL: peak_db=$($diag.peak_db) (silence! expected > -40)"
            exit 1
          }
          if ($diag.opus_frames_per_second -lt 10) {
            Write-Host "::error::AUDIO DIAGNOSTICS FAIL: opus_frames/s=$($diag.opus_frames_per_second) (expected > 10)"
            exit 1
          }
          Write-Host "AUDIO DIAGNOSTICS: PASS (peak=$($diag.peak_db)dB, $($diag.opus_frames_per_second) opus/s)"

      - name: Deactivate tone generator
        if: always() && steps.reaper-pre.outputs.was_running == 'true'
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "http://iem.lan:8080/_/SET/EXTSTATE/reaperiem/tone_gen_action/stop" -UseBasicParsing | Out-Null
          try {
            # Use dynamically-registered action ID
            $toneIdResp = (Invoke-WebRequest -Uri "http://iem.lan:8080/_/GET/EXTSTATE/reaperiem/action_tone_generator" -UseBasicParsing).Content
            $toneActionId = ($toneIdResp -split "`t")[-1]
            if ($toneActionId) {
              Invoke-WebRequest -Uri "http://iem.lan:8080/_/$toneActionId" -UseBasicParsing | Out-Null
            }
          } catch {
            Write-Host "::warning::Could not trigger tone gen stop: $_"
          }
          Start-Sleep -Seconds 1
          $result = (Invoke-WebRequest -Uri "http://iem.lan:8080/_/GET/EXTSTATE/reaperiem/tone_gen_result" -UseBasicParsing).Content
          Write-Host "Tone generator cleanup: $result"

      - name: Verify deployment
        shell: powershell
        run: |
          $proc = Get-Process -Name "iem-mixer-app" -ErrorAction SilentlyContinue
          if (-not $proc) {
            Write-Host "::error::App process not running"
            exit 1
          }
          Write-Host "App running: PID $($proc.Id), Session $($proc.SessionId)"

          # Verify version matches this commit
          $expected_hash = (git rev-parse --short HEAD).Trim()
          $maxRetries = 8
          $retryDelay = 5

          for ($i = 1; $i -le $maxRetries; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:80/api/version" -UseBasicParsing
              $version = $response.Content | ConvertFrom-Json

              Write-Host "Expected: $expected_hash"
              Write-Host "Deployed: $($version.git_hash)"

              if ($version.git_hash -eq "unknown") {
                Write-Host "::error::GIT_HASH is 'unknown' - build.rs did not set version info!"
                exit 1
              }

              if ($version.git_hash -ne $expected_hash) {
                Write-Host "::error::VERSION MISMATCH! Expected $expected_hash but got $($version.git_hash)"
                exit 1
              }

              Write-Host "Version verified: $($version.full_version)"

              # Also test landing page and API
              $landing = Invoke-WebRequest -Uri "http://localhost:80/" -UseBasicParsing
              Write-Host "Landing page: OK (status $($landing.StatusCode))"

              $members = Invoke-WebRequest -Uri "http://localhost:80/api/members" -UseBasicParsing
              $memberData = $members.Content | ConvertFrom-Json
              Write-Host "API members: $($memberData.Count) members loaded"

              # Also verify HTTPS if cert was deployed
              $configDir = [Environment]::GetFolderPath('ApplicationData') + "\iem-mixer"
              if (Test-Path "$configDir\cert.pem") {
                try {
                  $httpsResp = Invoke-WebRequest -Uri "https://iem.newlevel.media/api/version" -UseBasicParsing
                  Write-Host "HTTPS verified: OK"
                } catch {
                  Write-Host "::warning::HTTPS not responding (cert may need DNS propagation)"
                }
              }

              # Verify non-hashed assets have no-cache (prevents CDN stale cache + SRI mismatch)
              $swResp = Invoke-WebRequest -Uri "http://localhost:80/sw.js" -UseBasicParsing
              $swCache = $swResp.Headers["Cache-Control"]
              if ($swCache -notmatch "no-cache") {
                Write-Host "::error::sw.js has wrong cache-control: $swCache (expected no-cache)"
                exit 1
              }
              Write-Host "Cache-control headers: OK (non-hashed assets have no-cache)"

              Write-Host "Deployment fully verified!"
              exit 0
            } catch {
              Write-Host "Attempt ${i}: $_"
              if ($i -eq $maxRetries) {
                # Dump full log on final failure for debugging
                Write-Host "=== FULL APP LOG ON FAILURE ==="
                $logDir = [Environment]::GetFolderPath('ApplicationData') + "\iem-mixer\logs"
                if (Test-Path $logDir) {
                  Get-ChildItem $logDir -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1 | ForEach-Object {
                    Get-Content $_.FullName -Tail 100 | ForEach-Object { Write-Host "  $_" }
                  }
                }
                Write-Host "=== ALL LISTENING PORTS ==="
                netstat -an | Select-String "LISTENING" | ForEach-Object { Write-Host "  $_" }
                Write-Host "=== END DEBUG ==="
                Write-Host "::error::App is running but HTTP endpoints not responding"
                exit 1
              }
              Start-Sleep -Seconds $retryDelay
            }
          }

      - name: Setup Node.js for post-deploy E2E
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright for post-deploy E2E
        shell: powershell
        working-directory: iem-mixer/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Save REAPER project before E2E
        shell: powershell
        run: |
          $rppPath = "C:\Users\newlevel\Documents\reaperiem\projects\sunday_service.RPP"
          $bakPath = "$rppPath.e2e-bak"
          try {
            # Save project to disk (action 40026)
            Invoke-WebRequest -Uri "http://iem.lan:8080/_/40026" -UseBasicParsing -TimeoutSec 5 | Out-Null
            Start-Sleep -Seconds 2
            # Create backup of the saved .RPP file BEFORE E2E tests modify anything
            Copy-Item -Path $rppPath -Destination $bakPath -Force
            Write-Host "REAPER project saved and backed up to $bakPath"
          } catch {
            Write-Host "::error::Failed to save/backup REAPER project: $_"
            exit 1
          }

      - name: Run post-deploy E2E tests
        shell: powershell
        working-directory: iem-mixer/e2e
        run: npx playwright test --config=playwright.live.config.ts --reporter=list
        env:
          E2E_BASE_URL: http://localhost

      - name: Restore REAPER project after E2E
        if: always()
        shell: powershell
        run: |
          $rppPath = "C:\Users\newlevel\Documents\reaperiem\projects\sunday_service.RPP"
          $bakPath = "$rppPath.e2e-bak"
          try {
            if (-not (Test-Path $bakPath)) {
              Write-Host "::warning::No backup found at $bakPath - cannot restore"
              exit 0
            }
            # Save project to clear dirty flag (prevents Save dialog on reload)
            Invoke-WebRequest -Uri "http://iem.lan:8080/_/40026" -UseBasicParsing -TimeoutSec 5 | Out-Null
            Start-Sleep -Seconds 2
            # Overwrite RPP with pre-E2E backup
            Copy-Item -Path $bakPath -Destination $rppPath -Force
            Write-Host "Backup restored to $rppPath"
            # Reload project via dynamic action ID
            $regResult = (Invoke-WebRequest -Uri "http://iem.lan:8080/_/GET/EXTSTATE/reaperiem/register_result" -UseBasicParsing -TimeoutSec 5).Content
            $revertId = ""
            if ($regResult -match "revert_project=(\d+)") {
              $revertId = $matches[1]
            }
            if ($revertId) {
              Invoke-WebRequest -Uri "http://iem.lan:8080/_/$revertId" -UseBasicParsing -TimeoutSec 10 | Out-Null
              Start-Sleep -Seconds 5
              $result = (Invoke-WebRequest -Uri "http://iem.lan:8080/_/GET/EXTSTATE/reaperiem/revert_result" -UseBasicParsing -TimeoutSec 5).Content
              Write-Host "REAPER project reverted: $result"
            } else {
              Write-Host "::warning::Could not find revert_project action ID"
            }
            Remove-Item -Path $bakPath -Force -ErrorAction SilentlyContinue
          } catch {
            Write-Host "::error::Failed to restore REAPER project: $_"
          }

      - name: Upload post-deploy E2E results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-results
          path: iem-mixer/e2e/test-results/
          retention-days: 7
