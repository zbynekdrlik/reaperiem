name: CI

on:
  push:
    branches: [main]
    paths:
      - "iem-mixer/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "iem-mixer/**"
      - ".github/workflows/ci.yml"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Cancel in-progress runs for same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # LINT - Must pass before any builds
  # ============================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            iem-mixer/target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('iem-mixer/**/Cargo.lock') }}

      - name: Check formatting (strict)
        working-directory: iem-mixer
        run: cargo fmt --all -- --check

      - name: Clippy (strict - deny warnings)
        working-directory: iem-mixer
        run: cargo clippy --all-targets -- -D warnings -D clippy::all

  # ============================================================
  # TEST - Unit tests for core and server
  # ============================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            iem-mixer/target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('iem-mixer/**/Cargo.lock') }}

      - name: Create minimal dist folder for rust-embed
        run: |
          mkdir -p iem-mixer/iem-ui/dist
          echo "placeholder" > iem-mixer/iem-ui/dist/index.html

      - name: Run tests
        working-directory: iem-mixer
        run: cargo test -p iem-core -p iem-server

  # ============================================================
  # BUILD WASM - Frontend must build
  # ============================================================
  build-wasm:
    name: Build WASM Frontend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            iem-mixer/iem-ui/target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('iem-mixer/iem-ui/Cargo.lock') }}

      - name: Install Trunk
        run: |
          if ! command -v trunk &> /dev/null; then
            cargo install trunk
          fi

      - name: Build WASM (release)
        working-directory: iem-mixer/iem-ui
        run: trunk build --release

      - name: Verify WASM output
        run: |
          if [ ! -f iem-mixer/iem-ui/dist/index.html ]; then
            echo "ERROR: index.html not found in dist/"
            exit 1
          fi
          if ! ls iem-mixer/iem-ui/dist/*.wasm 1> /dev/null 2>&1; then
            echo "ERROR: No .wasm files found in dist/"
            exit 1
          fi
          echo "WASM build verified:"
          ls -la iem-mixer/iem-ui/dist/

      - name: Upload WASM dist
        uses: actions/upload-artifact@v4
        with:
          name: wasm-dist
          path: iem-mixer/iem-ui/dist/
          retention-days: 1

  # ============================================================
  # BUILD TAURI - Windows app must build
  # ============================================================
  build-tauri:
    name: Build Tauri (Windows)
    runs-on: windows-latest
    needs: [test, build-wasm]
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM dist
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: iem-mixer/iem-ui/dist/

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            iem-mixer/target/
          key: ${{ runner.os }}-cargo-tauri-${{ hashFiles('iem-mixer/**/Cargo.lock') }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Build Tauri (debug - CI validation)
        working-directory: iem-mixer/src-tauri
        run: cargo tauri build --debug

      - name: Verify binary exists
        shell: bash
        run: |
          if [ ! -f iem-mixer/src-tauri/target/debug/iem-mixer-app.exe ]; then
            echo "ERROR: Binary not found"
            exit 1
          fi
          echo "Build verified"

  # ============================================================
  # ALL CHECKS PASSED
  # ============================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, test, build-wasm, build-tauri]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Lint failed"
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests failed"
            exit 1
          fi
          if [ "${{ needs.build-wasm.result }}" != "success" ]; then
            echo "WASM build failed"
            exit 1
          fi
          if [ "${{ needs.build-tauri.result }}" != "success" ]; then
            echo "Tauri build failed"
            exit 1
          fi
          echo "All CI checks passed!"
