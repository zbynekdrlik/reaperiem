name: CI

on:
  push:
    branches: [main, dev]
    paths:
      - "iem-mixer/**"
      - "scripts/reascripts/**"
      - "mcp/**"
      - "config/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "iem-mixer/**"
      - "scripts/reascripts/**"
      - "mcp/**"
      - "config/**"
      - ".github/workflows/ci.yml"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Cancel in-progress push runs (stale code). Never cancel PR runs — they must
# finish for required status checks, and rapid pushes to dev kept killing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

jobs:
  # ============================================================
  # TEST INTEGRITY - Ensure tests aren't skipped/ignored
  # ============================================================
  test-integrity:
    name: Test Integrity Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check for ignored tests
        run: |
          echo "Checking for #[ignore] in Rust tests..."
          IGNORED=$(grep -r "#\[ignore\]" iem-mixer/crates iem-mixer/src-tauri 2>/dev/null || true)
          if [ -n "$IGNORED" ]; then
            echo "::error::Found ignored tests:"
            echo "$IGNORED"
            exit 1
          fi
          echo "No ignored tests found"

      - name: Check for skip patterns
        run: |
          echo "Checking for skip patterns..."
          SKIPPED=$(grep -rE "(\.skip\(|@skip|#\[ignore)" iem-mixer --include="*.rs" --include="*.ts" 2>/dev/null || true)
          if [ -n "$SKIPPED" ]; then
            echo "::error::Found skip patterns:"
            echo "$SKIPPED"
            exit 1
          fi
          echo "No skip patterns found"

      - name: Verify minimum test count
        working-directory: iem-mixer
        run: |
          echo "Counting tests..."
          TEST_COUNT=$(grep -r "#\[test\]" crates src-tauri 2>/dev/null | wc -l)
          echo "Found $TEST_COUNT unit tests"

          MIN_TESTS=10
          if [ "$TEST_COUNT" -lt "$MIN_TESTS" ]; then
            echo "::error::Only $TEST_COUNT tests found, minimum required: $MIN_TESTS"
            exit 1
          fi
          echo "Test count OK: $TEST_COUNT >= $MIN_TESTS"

      - name: Check E2E tests exist
        run: |
          if [ ! -d "iem-mixer/e2e" ]; then
            echo "::error::E2E test directory missing"
            exit 1
          fi
          E2E_COUNT=$(find iem-mixer/e2e -name "*.spec.ts" 2>/dev/null | wc -l)
          if [ "$E2E_COUNT" -lt 1 ]; then
            echo "::error::No E2E test files found"
            exit 1
          fi
          echo "E2E tests exist: $E2E_COUNT test files"

      - name: Ban ShowConsoleMsg in deferred ReaScripts
        run: |
          echo "Checking for ShowConsoleMsg in production ReaScripts..."
          # meter_bridge.lua runs continuously via defer() - console output
          # opens REAPER's console window, grabs focus, and blocks HTTP API.
          # One-shot scripts (set_hardware_output, setup, test) are exempt.
          BANNED_FILES="scripts/reascripts/meter_bridge.lua"
          FOUND=""
          for f in $BANNED_FILES; do
            HITS=$(grep -n "ShowConsoleMsg" "$f" 2>/dev/null || true)
            if [ -n "$HITS" ]; then
              FOUND="$FOUND\n$f:\n$HITS"
            fi
          done
          if [ -n "$FOUND" ]; then
            echo "::error::ShowConsoleMsg found in deferred ReaScripts (blocks REAPER HTTP API):"
            echo -e "$FOUND"
            exit 1
          fi
          echo "No ShowConsoleMsg in deferred ReaScripts"

      - name: Verify icon files (headphones shape)
        run: |
          echo "Verifying icon files are headphones shape (not blue rectangle)..."
          pip install --quiet pillow
          cd iem-mixer/src-tauri/icons
          python3 verify_icons.py

      - name: Ban continue-on-error in CI
        run: |
          echo "Checking for continue-on-error in CI workflows..."
          # Exclude this check step itself (grep matches its own source)
          FOUND=$(grep -rn "continue-on-error:" .github/workflows/ 2>/dev/null | grep -v "Ban continue-on-error" | grep -v "Checking for continue-on-error" || true)
          if [ -n "$FOUND" ]; then
            echo "::error::FORBIDDEN: continue-on-error found in CI workflows!"
            echo "::error::All CI steps must pass or fail explicitly. No silent failures."
            echo "$FOUND"
            exit 1
          fi
          echo "No continue-on-error found - all steps are hard gates"

      - name: Ban assume()/skip patterns in E2E tests
        run: |
          echo "Checking for banned skip patterns in E2E tests..."
          FOUND=0
          for pattern in "function assume(" "if (!assume(" "if (!(await waitForMixer" "ASSUME SKIP"; do
            HITS=$(grep -rn "$pattern" iem-mixer/e2e/tests/ 2>/dev/null || true)
            if [ -n "$HITS" ]; then
              echo "BANNED pattern found: $pattern"
              echo "$HITS"
              FOUND=1
            fi
          done
          if [ "$FOUND" = "1" ]; then
            echo "::error::E2E tests contain banned assume/skip patterns. Tests must use expect() and fail loudly."
            exit 1
          fi
          echo "OK: No assume/skip patterns found in E2E tests"

      - name: Self-test the disposal safety scanner (#153)
        run: |
          # Run the scanner's own unit tests first so a broken scanner
          # can never silently pass a violation through.
          python3 scripts/test_check_disposal_safety.py

      - name: Ban unsafe signal writes inside danger zones (#153)
        run: |
          # Prevents the Leptos "reactive value has already been disposed"
          # panic. Every set_*.set() / set_*.update() / .set_untracked() /
          # .update_untracked() inside a spawn_local async block OR a
          # Closure::wrap(Box::new(move ...)) block must use the try_*
          # variant so a mid-await or post-dispose fire is handled silently
          # instead of panicking.
          python3 scripts/check_disposal_safety.py

  # ============================================================
  # LINT - Must pass before any builds
  # ============================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libopus-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            iem-mixer/target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('iem-mixer/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting (strict)
        working-directory: iem-mixer
        run: cargo fmt --all -- --check

      - name: Create minimal dist folder for rust-embed
        run: |
          mkdir -p iem-mixer/iem-ui/dist
          echo "placeholder" > iem-mixer/iem-ui/dist/index.html

      - name: Clippy (strict - deny warnings)
        working-directory: iem-mixer
        run: |
          cargo clippy --all-targets -- -D warnings -D clippy::all
          cargo clippy -p iem-server --features audio -- -D warnings -D clippy::all

  # ============================================================
  # TEST - Unit tests for core and server
  # ============================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libopus-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            iem-mixer/target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('iem-mixer/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Create minimal dist folder for rust-embed
        run: |
          mkdir -p iem-mixer/iem-ui/dist
          echo "placeholder" > iem-mixer/iem-ui/dist/index.html

      - name: Run tests
        working-directory: iem-mixer
        run: |
          cargo test -p iem-core
          cargo test -p iem-server --features audio

  # ============================================================
  # BUILD WASM - Frontend must build
  # ============================================================
  build-wasm:
    name: Build WASM Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            iem-mixer/iem-ui/target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('iem-mixer/iem-ui/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Trunk
        run: |
          if ! command -v trunk &> /dev/null; then
            cargo install trunk
          fi

      - name: Build WASM (release)
        working-directory: iem-mixer/iem-ui
        run: trunk build --release

      - name: Verify WASM output
        run: |
          if [ ! -f iem-mixer/iem-ui/dist/index.html ]; then
            echo "ERROR: index.html not found in dist/"
            exit 1
          fi
          if ! ls iem-mixer/iem-ui/dist/*.wasm 1> /dev/null 2>&1; then
            echo "ERROR: No .wasm files found in dist/"
            exit 1
          fi
          echo "WASM build verified:"
          ls -la iem-mixer/iem-ui/dist/

      - name: Upload WASM dist
        uses: actions/upload-artifact@v4
        with:
          name: wasm-dist
          path: iem-mixer/iem-ui/dist/
          retention-days: 1

  # ============================================================
  # E2E TESTS - Browser tests must pass
  # ============================================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-integrity, build-wasm]
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM dist
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: iem-mixer/iem-ui/dist/

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libopus-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            iem-mixer/target/
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('iem-mixer/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build server
        working-directory: iem-mixer
        run: cargo build --package iem-server --features "standalone,audio" --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        working-directory: iem-mixer/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Copy config for E2E tests
        working-directory: iem-mixer
        run: |
          cp config/config.production.yaml config.yaml
          echo "Config copied. Members: $(grep -c 'name:' config.yaml 2>/dev/null || echo 0)"

      - name: Start server
        working-directory: iem-mixer
        run: |
          # Use pre-built binary instead of cargo run (avoids redundant compilation)
          ./target/release/iem-server &
          # Wait for server to be ready
          for i in {1..30}; do
            if curl -sf http://localhost:8080/ > /dev/null 2>&1; then
              echo "Server ready after $i seconds"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start within 30 seconds"
          exit 1
        env:
          RUST_LOG: info
          PORT: 8080

      - name: Run E2E tests
        working-directory: iem-mixer/e2e
        run: npx playwright test --reporter=list
        env:
          E2E_BASE_URL: http://localhost:8080

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: iem-mixer/e2e/test-results/

  # ============================================================
  # MUTATION TESTING - Test quality gate (kills weak tests)
  # ============================================================
  mutation-test:
    name: Mutation Testing
    runs-on: ubuntu-latest
    # Budget sized to cover larger feature PRs (baseline build ~3 min +
    # per-mutant build ~3-5 min). On a typical PR with <8 mutants this
    # finishes in 10-15 min; bigger surface (new modules + rewritten
    # handlers) can push into the 25-35 min range.
    timeout-minutes: 40
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history for diff against origin/main

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libopus-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            iem-mixer/target/
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('iem-mixer/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Create minimal dist folder for rust-embed
        run: |
          mkdir -p iem-mixer/iem-ui/dist
          echo "placeholder" > iem-mixer/iem-ui/dist/index.html

      - name: Compute diff against origin/main
        working-directory: iem-mixer
        run: |
          git fetch origin main
          # --relative emits paths relative to cwd (iem-mixer/), matching
          # the workspace-relative paths cargo-mutants expects from --in-diff.
          # Without it, paths would be repo-root-relative ("iem-mixer/crates/...")
          # and cargo-mutants would silently match zero files.
          # Triple-dot diff: changes from merge base to HEAD.
          git diff --relative origin/main...HEAD -- 'crates/iem-core/**/*.rs' 'crates/iem-server/**/*.rs' > pr.diff
          echo "Diff size: $(wc -l < pr.diff) lines"
          if [ ! -s pr.diff ]; then
            echo "No Rust changes in iem-core or iem-server — nothing to mutate"
          fi

      - name: Run mutation testing
        working-directory: iem-mixer
        run: |
          if [ ! -s pr.diff ]; then
            echo "Skipping cargo-mutants run: empty diff"
            exit 0
          fi
          # Two invocations: `--features pkg/feat` is only valid at the
          # workspace level, not with `--package <name>`. cargo rejects
          # `cargo test -p iem-core --features iem-server/audio` because
          # iem-core doesn't know the audio feature exists. Run each
          # package separately with its own feature set, matching what
          # the regular `test` job compiles.
          echo "=== Mutating iem-core ==="
          cargo mutants \
            --in-diff pr.diff \
            --package iem-core \
            --timeout 300 \
            --jobs 2 \
            --no-shuffle
          echo "=== Mutating iem-server (--features audio) ==="
          # Exclude axum route handlers and WebSocket handlers that require
          # a full AppState + WS harness to unit-test meaningfully.  These
          # functions are covered end-to-end by the live Playwright tests
          # in e2e/tests/live/ (talkback-quality.spec.ts for #154).
          cargo mutants \
            --in-diff pr.diff \
            --package iem-server \
            --features audio \
            --timeout 300 \
            --jobs 2 \
            --no-shuffle \
            --exclude-re 'handle_talkback_ws' \
            --exclude-re 'talkback_diagnostics_handler'

  # ============================================================
  # CHECK VERSION BUMP - Only on PRs to main
  # Compares PR version against main branch version
  # ============================================================
  check-version-bump:
    name: Verify Version Bump
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR version
        id: pr_version
        run: |
          VERSION=$(grep -m1 '^version' iem-mixer/crates/iem-core/Cargo.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "PR version: $VERSION"

      - name: Get main branch version
        id: main_version
        run: |
          VERSION=$(git show origin/main:iem-mixer/crates/iem-core/Cargo.toml | grep -m1 '^version' | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Main branch version: $VERSION"

      - name: Compare versions
        run: |
          PR_VER="${{ steps.pr_version.outputs.version }}"
          MAIN_VER="${{ steps.main_version.outputs.version }}"

          if [ "$PR_VER" = "$MAIN_VER" ]; then
            echo "::error::Version $PR_VER is the same as main branch!"
            echo "::error::Bump version in iem-mixer/crates/iem-core/Cargo.toml before merging."
            echo ""
            echo "Main:  $MAIN_VER"
            echo "PR:    $PR_VER"
            exit 1
          fi
          echo "Version bump verified: $MAIN_VER -> $PR_VER"

  # ============================================================
  # BUILD TAURI - Windows app (all events)
  # ============================================================
  build-tauri:
    name: Build Tauri (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [test, build-wasm]
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM dist
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: iem-mixer/iem-ui/dist/

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cargo cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            iem-mixer/target/
          key: ${{ runner.os }}-cargo-tauri-${{ hashFiles('iem-mixer/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Tauri CLI
        shell: bash
        run: |
          if ! command -v cargo-tauri &> /dev/null; then
            cargo install tauri-cli
          fi

      - name: Build Tauri (release)
        working-directory: iem-mixer/src-tauri
        run: cargo tauri build

      - name: Verify installer exists
        shell: bash
        run: |
          INSTALLER=$(ls iem-mixer/target/release/bundle/nsis/*.exe 2>/dev/null | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "ERROR: NSIS installer not found"
            exit 1
          fi
          echo "Installer found: $INSTALLER"

      - name: Upload Tauri installer
        uses: actions/upload-artifact@v4
        with:
          name: tauri-installer
          path: iem-mixer/target/release/bundle/nsis/*.exe
          retention-days: 1

  # ============================================================
  # BUILD VBAN VST3 - VBAN IEM sender plugin for REAPER
  # ============================================================
  build-vban:
    name: Build VBAN VST3
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: iem-mixer/vban-vst/build
          key: ${{ runner.os }}-vban-cmake-${{ hashFiles('iem-mixer/vban-vst/CMakeLists.txt', 'iem-mixer/vban-vst/src/**') }}

      - name: Configure CMake
        working-directory: iem-mixer/vban-vst
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        working-directory: iem-mixer/vban-vst
        run: cmake --build build --config Release

      - name: Find and verify VST3 bundles
        shell: bash
        run: |
          BUNDLES=$(find iem-mixer/vban-vst/build -name "*.vst3" -type d)
          if [ -z "$BUNDLES" ]; then
            echo "ERROR: No VST3 bundles found"
            find iem-mixer/vban-vst/build -type f -name "*.dll" -o -name "*.vst3" 2>/dev/null
            exit 1
          fi
          echo "$BUNDLES" | while read -r VST3; do
            echo "VST3 bundle found: $VST3"
            ls -la "$VST3"
          done

      - name: Upload VBAN VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: vban-vst3
          path: iem-mixer/vban-vst/build/**/*.vst3
          retention-days: 1

  # ============================================================
  # DEPLOY TO IEM.LAN - Auto deploy on push to main or dev
  # Uses existing self-hosted runner on iem.lan (Windows)
  # ============================================================
  deploy:
    name: Deploy to iem.lan
    runs-on: [self-hosted, iem-lan]
    timeout-minutes: 25
    concurrency:
      group: iem-lan-runner
      cancel-in-progress: false
    needs:
      [test-integrity, lint, test, build-wasm, build-tauri, build-vban, e2e]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM dist
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: wasm-dist/

      - name: Download Tauri installer
        uses: actions/download-artifact@v4
        with:
          name: tauri-installer
          path: installer/

      - name: Download VBAN VST3
        uses: actions/download-artifact@v4
        with:
          name: vban-vst3
          path: vban-vst3/

      - name: Verify REAPER health (pre-deploy)
        id: reaper-pre
        shell: powershell
        run: |
          $reaper = Get-Process -Name "reaper" -ErrorAction SilentlyContinue
          if ($reaper) {
            Write-Host "REAPER running: PID $($reaper.Id)"
            echo "was_running=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "::warning::REAPER not running before deploy"
            echo "was_running=false" >> $env:GITHUB_OUTPUT
          }

      - name: Stop running IEM Mixer
        shell: powershell
        run: |
          # Kill iem-mixer-app using multiple methods for reliability.
          # taskkill /f can fail for cross-session processes, so fall back
          # to Stop-Process (PowerShell) and wmic (WMI) if needed.
          $ErrorActionPreference = "SilentlyContinue"
          & taskkill /f /im iem-mixer-app.exe 2>&1 | Out-Null
          Start-Sleep -Seconds 2
          $proc = Get-Process -Name "iem-mixer-app" -ErrorAction SilentlyContinue
          if ($proc) {
            Write-Host "taskkill failed, trying Stop-Process..."
            Stop-Process -Name "iem-mixer-app" -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
          }
          $proc = Get-Process -Name "iem-mixer-app" -ErrorAction SilentlyContinue
          if ($proc) {
            Write-Host "Stop-Process failed, trying wmic..."
            & wmic process where "name='iem-mixer-app.exe'" delete 2>&1 | Out-Null
            Start-Sleep -Seconds 2
          }
          $ErrorActionPreference = "Stop"
          $proc = Get-Process -Name "iem-mixer-app" -ErrorAction SilentlyContinue
          if ($proc) {
            Write-Host "::error::Cannot stop iem-mixer-app (PID $($proc.Id)) after all methods"
            exit 1
          }
          Write-Host "Process stopped"
          exit 0

      - name: Verify UDP 7980 is localhost-only (no firewall needed)
        shell: powershell
        run: |
          # VBAN IEM sends UDP to 127.0.0.1:7980 (localhost-only).
          # Windows firewall does not block localhost traffic, so no rule is needed.
          # Just log the status for visibility.
          Write-Host "VBAN audio uses localhost UDP (127.0.0.1:7980) - firewall not required"

      - name: Install and start IEM Mixer
        shell: powershell
        env:
          TLS_CERT_PEM: ${{ secrets.TLS_CERT_PEM }}
          TLS_KEY_PEM: ${{ secrets.TLS_KEY_PEM }}
        run: |
          $ErrorActionPreference = "Stop"

          # Runner MUST be in an interactive session (session 1+) for tray icon support.
          # The runner is configured as a user-mode app via Startup shortcut, NOT a Windows service.
          $sessionId = [System.Diagnostics.Process]::GetCurrentProcess().SessionId
          Write-Host "Runner session: $sessionId"
          if ($sessionId -eq 0) {
            Write-Host "::error::Runner is in session 0 (service mode). Tray icon will not work."
            Write-Host "::error::Reconfigure runner: stop service, use Startup shortcut for run.cmd"
            exit 1
          }

          # Install — pick the installer matching current version from tauri.conf.json
          $version = (Get-Content "iem-mixer\src-tauri\tauri.conf.json" | ConvertFrom-Json).version
          Write-Host "Expected version: $version"
          $installer = Get-ChildItem -Path "installer" -Filter "*${version}*.exe" | Select-Object -First 1
          if (-not $installer) {
            Write-Host "No installer for version $version, falling back to newest"
            $installer = Get-ChildItem -Path "installer" -Filter "*.exe" | Sort-Object Name -Descending | Select-Object -First 1
          }
          if (-not $installer) {
            Write-Host "::error::No installer found in artifact!"
            exit 1
          }
          Write-Host "Running installer: $($installer.FullName)"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            Write-Host "::error::Installer failed with exit code $($process.ExitCode)"
            exit 1
          }

          # Verify installation
          $appData = [Environment]::GetFolderPath('LocalApplicationData')
          $installDir = "$appData\IEM Mixer"
          $exePath = "$installDir\iem-mixer-app.exe"
          if (-not (Test-Path $exePath)) {
            Write-Host "::error::Executable not found at $exePath"
            exit 1
          }
          Write-Host "Installed: $exePath"

          # Deploy config (only if not present — never overwrite, preserves
          # auto-generated secrets like jwt_secret and vapid_private_key)
          $configDir = [Environment]::GetFolderPath('ApplicationData') + "\iem-mixer"
          if (-not (Test-Path $configDir)) {
            New-Item -ItemType Directory -Path $configDir -Force | Out-Null
          }
          if (-not (Test-Path "$configDir\config.yaml")) {
            Copy-Item "iem-mixer\config\config.production.yaml" "$configDir\config.yaml" -Force
            Write-Host "Config: deployed fresh config.yaml"
          } else {
            Write-Host "Config: $configDir\config.yaml already exists, preserving secrets"
          }

          # Deploy TLS certificates
          $tlsCert = "$env:TLS_CERT_PEM"
          $tlsKey = "$env:TLS_KEY_PEM"
          if ($tlsCert -and $tlsKey) {
            [System.IO.File]::WriteAllText("$configDir\cert.pem", $tlsCert)
            # Remove old key.pem (may have restricted permissions from previous deploy)
            if (Test-Path "$configDir\key.pem") {
              Remove-Item "$configDir\key.pem" -Force -ErrorAction SilentlyContinue
            }
            [System.IO.File]::WriteAllText("$configDir\key.pem", $tlsKey)
            Write-Host "TLS certificates deployed"
          } else {
            Write-Host "::warning::TLS secrets not set - HTTPS will not be available"
          }

          # Reserve ports 80 and 443 for non-admin use (idempotent)
          # netsh returns exit code 1 if reservation exists - suppress under SilentlyContinue
          $ErrorActionPreference = "SilentlyContinue"
          & netsh http add urlacl url=http://+:80/ user=$env:USERNAME 2>&1 | Out-Null
          & netsh http add urlacl url=https://+:443/ user=$env:USERNAME 2>&1 | Out-Null
          $ErrorActionPreference = "Stop"

          # Create Startup launcher (ensures clean start on reboot)
          $launcherPath = "$installDir\iem-mixer-launcher.bat"
          $logPath = "$installDir\launcher.log"
          $lines = @(
            "@echo off",
            "echo [%date% %time%] Launcher started >> `"$logPath`"",
            "taskkill /im iem-mixer-app.exe /f >nul 2>&1",
            "ping -n 4 127.0.0.1 >nul",
            "start `"`" `"$exePath`"",
            "echo [%date% %time%] App started >> `"$logPath`""
          )
          [System.IO.File]::WriteAllText($launcherPath, ($lines -join "`r`n"))

          $startupDir = [Environment]::GetFolderPath('Startup')
          $shortcutPath = "$startupDir\IEM Mixer.lnk"
          $ws = New-Object -ComObject WScript.Shell
          $sc = $ws.CreateShortcut($shortcutPath)
          $sc.TargetPath = $launcherPath
          $sc.WorkingDirectory = $installDir
          $sc.WindowStyle = 7
          $sc.Description = "IEM Mixer"
          $sc.Save()
          Write-Host "Startup shortcut: $shortcutPath"

          # Start app via WMI to create a detached process that survives runner cleanup.
          # GitHub Actions kills child processes ("orphans") when the job ends.
          # WMI Win32_Process.Create spawns outside the runner's process tree.
          $result = ([wmiclass]"Win32_Process").Create($exePath)
          if ($result.ReturnValue -ne 0) {
            Write-Host "::error::WMI process creation failed: return $($result.ReturnValue)"
            exit 1
          }
          Write-Host "Started via WMI: PID $($result.ProcessId)"
          Start-Sleep -Seconds 8

          # Verify exactly one process started in interactive session
          $procs = @(Get-Process -Name "iem-mixer-app" -ErrorAction SilentlyContinue)
          if ($procs.Count -eq 0) {
            Write-Host "::error::App process failed to start"
            exit 1
          }
          if ($procs.Count -gt 1) {
            Write-Host "::error::Multiple iem-mixer-app processes found:"
            $procs | ForEach-Object { Write-Host "  PID $($_.Id), Session $($_.SessionId)" }
            exit 1
          }
          $proc = $procs[0]
          Write-Host "App running: PID $($proc.Id), Session $($proc.SessionId)"
          if ($proc.SessionId -eq 0) {
            Write-Host "::error::App started in session 0 - tray icon will not work"
            exit 1
          }
          exit 0

      - name: Deploy VBAN VST3 to REAPER plugin path
        shell: powershell
        run: |
          # Deploy to standard Windows VST3 path (REAPER scans this automatically)
          # Directory created with admin + icacls granting newlevel full control
          $vst3Dest = "C:\Program Files\Common Files\VST3"
          if (-not (Test-Path $vst3Dest)) {
            New-Item -ItemType Directory -Path $vst3Dest -Force | Out-Null
          }

          # Find all VST3 bundles in the artifact
          $vst3Sources = Get-ChildItem -Path "vban-vst3" -Filter "*.vst3" -Recurse -Directory
          if (-not $vst3Sources) {
            Write-Host "::error::No VST3 bundles found in artifact"
            exit 1
          }

          # REAPER locks loaded VST3 DLLs - must save + quit REAPER before overwriting
          $reaperRunning = Get-Process -Name "reaper" -ErrorAction SilentlyContinue
          if ($reaperRunning) {
            Write-Host "Saving REAPER project before VST3 deploy..."
            try { Invoke-WebRequest -Uri "http://iem.lan:8080/_/40026" -UseBasicParsing -TimeoutSec 5 | Out-Null } catch {}
            Start-Sleep -Seconds 2
            Write-Host "Quitting REAPER via HTTP API (action 40004)..."
            try { Invoke-WebRequest -Uri "http://iem.lan:8080/_/40004" -UseBasicParsing -TimeoutSec 5 | Out-Null } catch {}
            # Wait for REAPER to exit
            $waited = 0
            while ($waited -lt 15) {
              Start-Sleep -Seconds 2
              $waited += 2
              $still = Get-Process -Name "reaper" -ErrorAction SilentlyContinue
              if (-not $still) { break }
            }
            if (Get-Process -Name "reaper" -ErrorAction SilentlyContinue) {
              Write-Host "::warning::REAPER did not quit gracefully, force killing..."
              $ErrorActionPreference = "Continue"
              taskkill /f /im reaper.exe 2>&1 | Out-Null
              $ErrorActionPreference = "Stop"
              Start-Sleep -Seconds 3
            }
            Write-Host "REAPER stopped"
          }

          # Copy each VST3 bundle directory
          foreach ($vst3Source in $vst3Sources) {
            $destPath = Join-Path $vst3Dest $vst3Source.Name
            if (Test-Path $destPath) {
              Remove-Item $destPath -Recurse -Force
            }
            Copy-Item $vst3Source.FullName $destPath -Recurse -Force
            Write-Host "VST3 deployed: $destPath"

            # Verify the bundle was copied
            if (-not (Test-Path $destPath)) {
              Write-Host "::error::VST3 bundle not found at $destPath"
              exit 1
            }
          }

          # Restart REAPER with project
          if ($reaperRunning) {
            Write-Host "Restarting REAPER..."

            # Force-create (or update) the StartREAPER task with the correct project path
            $reaperExe = "C:\Program Files\REAPER (x64)\reaper.exe"
            $projectPath = "C:\Users\newlevel\Documents\reaperiem\projects\sunday_service.RPP"
            $taskTr = "`"$reaperExe`" `"$projectPath`""
            & schtasks /create /tn "StartREAPER" /tr $taskTr /sc once /st 00:00 /f
            Write-Host "StartREAPER task created/updated with project path"

            & schtasks /run /tn "StartREAPER" 2>&1 | Out-Null

            # Wait up to 30 seconds for REAPER HTTP API to respond with project loaded
            $reaperReady = $false
            $waited = 0
            while ($waited -lt 30) {
              Start-Sleep -Seconds 3
              $waited += 3
              try {
                $ntrackResp = Invoke-WebRequest -Uri "http://iem.lan:8080/_/NTRACK" -UseBasicParsing -TimeoutSec 5
                # Response format: "NTRACK\t33" — extract the number after the tab
                $ntrackParts = $ntrackResp.Content.Trim() -split "`t"
                $ntrack = [int]$ntrackParts[-1]
                if ($ntrack -gt 0) {
                  Write-Host "REAPER restarted and project loaded (NTRACK=$ntrack, waited ${waited}s)"
                  $reaperReady = $true
                  break
                }
              } catch {}
            }

            if (-not $reaperReady) {
              Write-Host "::error::REAPER did not come back with project loaded within 30s after VST3 deploy"
              Write-Host "::error::Check iem.lan: Is the StartREAPER task configured? Is the project path correct?"
              exit 1
            }

            # Save the project now that REAPER is back up
            try {
              Invoke-WebRequest -Uri "http://iem.lan:8080/_/40026" -UseBasicParsing -TimeoutSec 5 | Out-Null
              Write-Host "REAPER project saved"
            } catch {
              Write-Host "::warning::Could not save REAPER project after restart: $_"
            }
          }
          Write-Host "Deployed VST3 bundles:"
          foreach ($vst3Source in $vst3Sources) {
            $destPath = Join-Path $vst3Dest $vst3Source.Name
            Get-ChildItem -Path $destPath -Recurse | ForEach-Object { Write-Host "  $($_.FullName)" }
          }

