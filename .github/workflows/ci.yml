name: CI

on:
  push:
    branches: [main]
    paths:
      - "iem-mixer/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "iem-mixer/**"
      - ".github/workflows/ci.yml"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Cancel in-progress runs for same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # TEST INTEGRITY - Ensure tests aren't skipped/ignored
  # ============================================================
  test-integrity:
    name: Test Integrity Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for ignored tests
        run: |
          echo "Checking for #[ignore] in Rust tests..."
          IGNORED=$(grep -r "#\[ignore\]" iem-mixer/crates iem-mixer/src-tauri 2>/dev/null || true)
          if [ -n "$IGNORED" ]; then
            echo "::error::Found ignored tests:"
            echo "$IGNORED"
            exit 1
          fi
          echo "No ignored tests found"

      - name: Check for skip patterns
        run: |
          echo "Checking for skip patterns..."
          SKIPPED=$(grep -rE "(\.skip\(|@skip|#\[ignore)" iem-mixer --include="*.rs" --include="*.ts" 2>/dev/null || true)
          if [ -n "$SKIPPED" ]; then
            echo "::error::Found skip patterns:"
            echo "$SKIPPED"
            exit 1
          fi
          echo "No skip patterns found"

      - name: Verify minimum test count
        working-directory: iem-mixer
        run: |
          echo "Counting tests..."
          TEST_COUNT=$(grep -r "#\[test\]" crates src-tauri 2>/dev/null | wc -l)
          echo "Found $TEST_COUNT unit tests"

          MIN_TESTS=10
          if [ "$TEST_COUNT" -lt "$MIN_TESTS" ]; then
            echo "::error::Only $TEST_COUNT tests found, minimum required: $MIN_TESTS"
            exit 1
          fi
          echo "Test count OK: $TEST_COUNT >= $MIN_TESTS"

      - name: Check E2E tests exist
        run: |
          if [ ! -d "iem-mixer/e2e" ]; then
            echo "::error::E2E test directory missing"
            exit 1
          fi
          E2E_COUNT=$(find iem-mixer/e2e -name "*.spec.ts" 2>/dev/null | wc -l)
          if [ "$E2E_COUNT" -lt 1 ]; then
            echo "::error::No E2E test files found"
            exit 1
          fi
          echo "E2E tests exist: $E2E_COUNT test files"

  # ============================================================
  # LINT - Must pass before any builds
  # ============================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            iem-mixer/target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('iem-mixer/**/Cargo.lock') }}

      - name: Check formatting (strict)
        working-directory: iem-mixer
        run: cargo fmt --all -- --check

      - name: Clippy (strict - deny warnings)
        working-directory: iem-mixer
        run: cargo clippy --all-targets -- -D warnings -D clippy::all

  # ============================================================
  # TEST - Unit tests for core and server
  # ============================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            iem-mixer/target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('iem-mixer/**/Cargo.lock') }}

      - name: Create minimal dist folder for rust-embed
        run: |
          mkdir -p iem-mixer/iem-ui/dist
          echo "placeholder" > iem-mixer/iem-ui/dist/index.html

      - name: Run tests
        working-directory: iem-mixer
        run: cargo test -p iem-core -p iem-server

  # ============================================================
  # BUILD WASM - Frontend must build
  # ============================================================
  build-wasm:
    name: Build WASM Frontend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            iem-mixer/iem-ui/target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('iem-mixer/iem-ui/Cargo.lock') }}

      - name: Install Trunk
        run: |
          if ! command -v trunk &> /dev/null; then
            cargo install trunk
          fi

      - name: Build WASM (release)
        working-directory: iem-mixer/iem-ui
        run: trunk build --release

      - name: Verify WASM output
        run: |
          if [ ! -f iem-mixer/iem-ui/dist/index.html ]; then
            echo "ERROR: index.html not found in dist/"
            exit 1
          fi
          if ! ls iem-mixer/iem-ui/dist/*.wasm 1> /dev/null 2>&1; then
            echo "ERROR: No .wasm files found in dist/"
            exit 1
          fi
          echo "WASM build verified:"
          ls -la iem-mixer/iem-ui/dist/

      - name: Upload WASM dist
        uses: actions/upload-artifact@v4
        with:
          name: wasm-dist
          path: iem-mixer/iem-ui/dist/
          retention-days: 1

  # ============================================================
  # BUILD TAURI - Windows app must build
  # ============================================================
  build-tauri:
    name: Build Tauri (Windows)
    runs-on: windows-latest
    needs: [test, build-wasm]
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM dist
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: iem-mixer/iem-ui/dist/

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            iem-mixer/target/
          key: ${{ runner.os }}-cargo-tauri-${{ hashFiles('iem-mixer/**/Cargo.lock') }}

      - name: Install Tauri CLI
        shell: bash
        run: |
          if ! command -v cargo-tauri &> /dev/null; then
            cargo install tauri-cli
          fi

      - name: Build Tauri (release)
        working-directory: iem-mixer/src-tauri
        run: cargo tauri build

      - name: Verify installer exists
        shell: bash
        run: |
          INSTALLER=$(ls iem-mixer/target/release/bundle/nsis/*.exe 2>/dev/null | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "ERROR: NSIS installer not found"
            exit 1
          fi
          echo "Installer found: $INSTALLER"

      - name: Upload Tauri installer
        uses: actions/upload-artifact@v4
        with:
          name: tauri-installer
          path: iem-mixer/target/release/bundle/nsis/*.exe
          retention-days: 1

  # ============================================================
  # E2E TESTS - Browser tests must pass
  # ============================================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test-integrity, build-wasm]
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM dist
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: iem-mixer/iem-ui/dist/

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            iem-mixer/target/
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('iem-mixer/**/Cargo.lock') }}

      - name: Build server
        working-directory: iem-mixer
        run: cargo build --package iem-server --features standalone --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        working-directory: iem-mixer/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Start server
        working-directory: iem-mixer
        run: |
          cargo run --package iem-server --features standalone --release &
          # Wait for server to be ready (may take a while if compiling)
          for i in {1..60}; do
            if curl -sf http://localhost:8080/ > /dev/null 2>&1; then
              echo "Server ready after $i seconds"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start within 60 seconds"
          exit 1
        env:
          RUST_LOG: info
          PORT: 8080

      - name: Run E2E tests
        working-directory: iem-mixer/e2e
        run: npx playwright test --reporter=list
        env:
          E2E_BASE_URL: http://localhost:8080

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: iem-mixer/e2e/test-results/

  # ============================================================
  # DEPLOY TO IEM.LAN - Auto deploy after all checks pass
  # Uses existing self-hosted runner on iem.lan (Windows)
  # ============================================================
  deploy:
    name: Deploy to iem.lan
    runs-on: [self-hosted, iem-lan]
    needs: [test-integrity, lint, test, build-wasm, build-tauri, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM dist
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: wasm-dist/

      - name: Download Tauri installer
        uses: actions/download-artifact@v4
        with:
          name: tauri-installer
          path: installer/

      - name: Clean ALL old installations
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"  # Don't fail on cleanup errors

          Write-Host "=== KILLING ALL IEM PROCESSES ==="
          # Kill by multiple name patterns to catch everything
          @("IEM Mixer", "iem-mixer", "iem-mixer-app", "iem-server") | ForEach-Object {
            Get-Process -Name $_ -ErrorAction SilentlyContinue | Stop-Process -Force
          }
          # Also kill by path pattern
          Get-Process | Where-Object { $_.Path -match "iem" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          Write-Host "=== REMOVING ALL OLD INSTALLATIONS ==="
          # ALL known mess locations
          $oldPaths = @(
            "C:\iem-mixer",
            "C:\Program Files\IEM Mixer",
            "C:\Program Files (x86)\IEM Mixer",
            "$env:USERPROFILE\iem-mixer",
            "$env:USERPROFILE\AppData\Local\IEM Mixer",
            "$env:LOCALAPPDATA\IEM Mixer"
          )

          foreach ($path in $oldPaths) {
            if (Test-Path $path) {
              Write-Host "REMOVING: $path"
              Remove-Item -Path $path -Recurse -Force -ErrorAction SilentlyContinue
              if (Test-Path $path) {
                Write-Host "::warning::Could not fully remove $path - may have locked files"
              }
            }
          }

          # Clean any Task Scheduler tasks (suppress errors properly)
          @("IEMMixerStart", "IEMStart") | ForEach-Object {
            & schtasks /Delete /TN $_ /F 2>&1 | Out-Null
          }

          Write-Host "=== CLEANUP COMPLETE ==="

      - name: Install and start IEM Mixer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"  # Fail on ANY error

          # Verify installer exists
          $installer = Get-ChildItem -Path "installer" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            Write-Host "::error::No installer found in artifact!"
            exit 1
          }
          Write-Host "Running installer: $($installer.FullName)"

          # Run installer with timeout
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            Write-Host "::error::Installer failed with exit code $($process.ExitCode)"
            exit 1
          }
          Write-Host "Installation complete"

          # Verify installation
          $appData = [Environment]::GetFolderPath('LocalApplicationData')
          $installDir = "$appData\IEM Mixer"
          $exePath = "$installDir\IEM Mixer.exe"

          if (-not (Test-Path $exePath)) {
            Write-Host "::error::Installation failed - executable not found at $exePath"
            exit 1
          }

          # Copy config
          Copy-Item "iem-mixer\config\config.production.yaml" "$installDir\config.yaml" -Force
          if (-not (Test-Path "$installDir\config.yaml")) {
            Write-Host "::error::Config copy failed"
            exit 1
          }
          Write-Host "Config deployed to $installDir"

          # Start app via Task Scheduler (proper error handling for schtasks)
          $taskName = "IEMMixerStart"
          # Delete existing task - suppress ALL output including stderr
          & schtasks /Delete /TN $taskName /F 2>&1 | Out-Null
          # Create new task
          & schtasks /Create /TN $taskName /TR "`"$exePath`"" /SC ONCE /ST 00:00 /F
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Failed to create scheduled task"
            exit 1
          }
          # Run the task
          & schtasks /Run /TN $taskName
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Failed to run scheduled task"
            exit 1
          }
          Start-Sleep -Seconds 3
          Write-Host "App started via Task Scheduler"

      - name: Deploy WASM to REAPER www root
        shell: cmd
        run: |
          xcopy /E /Y wasm-dist\* "C:\Program Files\REAPER (x64)\Plugins\reaper_www_root\iem-mixer\"
          echo WASM deployed to REAPER www root

      - name: Verify WASM deployment
        shell: cmd
        run: |
          if exist "C:\Program Files\REAPER (x64)\Plugins\reaper_www_root\iem-mixer\index.html" (
            echo WASM deployment verified!
          ) else (
            echo ERROR: WASM not found
            exit /b 1
          )

      - name: Verify deployed version matches build
        shell: powershell
        run: |
          # Get git hash from current commit
          $expected_hash = (git rev-parse --short HEAD).Trim()

          # Wait for app to be fully ready
          Start-Sleep -Seconds 5

          $maxRetries = 10
          $retryDelay = 3

          for ($i = 1; $i -le $maxRetries; $i++) {
            try {
              # Query version endpoint
              $response = Invoke-WebRequest -Uri "http://localhost/api/version" -UseBasicParsing
              $version = $response.Content | ConvertFrom-Json

              Write-Host "Expected: $expected_hash"
              Write-Host "Deployed: $($version.git_hash)"
              Write-Host "Full version: $($version.full_version)"

              # CRITICAL: Version must not be "unknown" - means build.rs didn't run
              if ($version.git_hash -eq "unknown") {
                Write-Host "::error::GIT_HASH is 'unknown' - build.rs did not set version info!"
                Write-Host "::error::This means the tray menu will show wrong version."
                exit 1
              }

              if ($version.git_hash -ne $expected_hash) {
                Write-Host "::error::VERSION MISMATCH! Old version still running."
                Write-Host "::error::Expected $expected_hash but got $($version.git_hash)"
                exit 1
              }

              Write-Host "Version verified: $($version.full_version)"
              break
            } catch {
              Write-Host "Attempt $i failed: $_"
              if ($i -eq $maxRetries) {
                Write-Host "::error::Version endpoint not responding after $maxRetries attempts"
                exit 1
              }
              Start-Sleep -Seconds $retryDelay
            }
          }

      - name: HTTP smoke test deployed app
        shell: powershell
        run: |
          $maxRetries = 10
          $retryDelay = 3

          for ($i = 1; $i -le $maxRetries; $i++) {
            try {
              # Test landing page
              $landing = Invoke-WebRequest -Uri "http://localhost/" -UseBasicParsing
              if ($landing.StatusCode -ne 200) { throw "Landing page failed with status $($landing.StatusCode)" }
              Write-Host "Landing page: OK"

              # Test API endpoint
              $members = Invoke-WebRequest -Uri "http://localhost/api/members" -UseBasicParsing
              if ($members.StatusCode -ne 200) { throw "API failed with status $($members.StatusCode)" }
              $memberData = $members.Content | ConvertFrom-Json
              if ($memberData.Count -eq 0) { throw "No members returned - config not loaded!" }
              Write-Host "API members: $($memberData.Count) members loaded"

              Write-Host "Smoke test PASSED"
              exit 0
            } catch {
              Write-Host "Attempt $i failed: $_"
              Start-Sleep -Seconds $retryDelay
            }
          }

          Write-Host "::error::Smoke test FAILED after $maxRetries attempts"
          exit 1

      - name: Verify deployment files and process
        shell: powershell
        run: |
          $appData = [Environment]::GetFolderPath('LocalApplicationData')
          $installDir = "$appData\IEM Mixer"

          # Verify installation
          if (Test-Path "$installDir\IEM Mixer.exe") {
            Write-Host "App installed: $installDir\IEM Mixer.exe"
          } else {
            Write-Host "::error::App not installed"
            exit 1
          }

          # Verify config exists
          if (Test-Path "$installDir\config.yaml") {
            Write-Host "Config deployed: $installDir\config.yaml"
          } else {
            Write-Host "::error::Config not found"
            exit 1
          }

          # Verify app is running
          $proc = Get-Process -Name "IEM Mixer" -ErrorAction SilentlyContinue
          if ($proc) {
            Write-Host "App running (PID: $($proc.Id))"
          } else {
            Write-Host "::error::App is not running"
            exit 1
          }

          Write-Host "Deployment complete!"

  # ============================================================
  # ALL CHECKS PASSED
  # ============================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [test-integrity, lint, test, build-wasm, build-tauri, e2e, deploy]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.test-integrity.result }}" != "success" ]; then
            echo "::error::Test integrity check failed"
            exit 1
          fi
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "::error::Lint failed"
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::Tests failed"
            exit 1
          fi
          if [ "${{ needs.build-wasm.result }}" != "success" ]; then
            echo "::error::WASM build failed"
            exit 1
          fi
          if [ "${{ needs.build-tauri.result }}" != "success" ]; then
            echo "::error::Tauri build failed"
            exit 1
          fi
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "::error::E2E tests failed"
            exit 1
          fi
          # Deploy is only for main branch pushes, so check if it was skipped or succeeded
          if [ "${{ needs.deploy.result }}" != "success" ] && [ "${{ needs.deploy.result }}" != "skipped" ]; then
            echo "::error::Deploy failed"
            exit 1
          fi
          echo "All CI checks passed!"
